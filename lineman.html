<!DOCTYPE html>
<!-- Spawn Jobs · Lineman app · v2.0 · login · jobs · petty cash · keys · tracking · 2026-11-21 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1a1f2e">
<title>Spawn Jobs</title>
<style>
  :root{
    --gold:#F5A623;--teal:#2BA89A;--blue:#3B6FD4;--navy:#2D3547;
    --red:#D63B3B;--green:#15803d;--muted:#8a93a3;--bg:#0f141b;--card:#1a212c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--bg);color:#e8edf3;min-height:100vh;display:flex;flex-direction:column}
  .wrap{flex:1;display:flex;flex-direction:column;padding:20px;max-width:480px;margin:0 auto;width:100%}
  .logo{font-weight:800;font-size:20px;letter-spacing:.5px;text-align:center;margin:8px 0 24px}
  .logo-globe{font-size:36px;margin-bottom:4px}
  .logo-sub{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:1px;margin-top:2px}
  .logo span{color:var(--gold)}
  .logo div:nth-child(2){letter-spacing:2px}
  .card{background:var(--card);border-radius:16px;padding:20px;margin-bottom:16px;border:1px solid #2a3340}
  label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
  select,input{width:100%;padding:14px;border-radius:12px;border:1.5px solid #2a3340;background:#0f141b;color:#fff;font-size:16px;margin-bottom:14px}
  .btn{width:100%;padding:16px;border:none;border-radius:14px;font-size:17px;font-weight:800;cursor:pointer;transition:.15s}
  .btn-start{background:var(--teal);color:#fff}
  .btn-stop{background:var(--red);color:#fff}
  .btn:active{transform:scale(.98)}
  .status{text-align:center;margin:20px 0}
  .dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:middle}
  .dot.on{background:var(--green);box-shadow:0 0 0 0 rgba(21,128,61,.6);animation:pulse 1.6s infinite}
  .dot.off{background:var(--muted)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(21,128,61,.6)}70%{box-shadow:0 0 0 12px rgba(21,128,61,0)}100%{box-shadow:0 0 0 0 rgba(21,128,61,0)}}
  .big{font-size:15px;font-weight:700}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
  .stat{background:#0f141b;border-radius:12px;padding:14px;text-align:center}
  .stat .v{font-size:22px;font-weight:800;color:var(--gold)}
  .stat .l{font-size:11px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.5px}
  .queue{font-size:13px;text-align:center;margin-top:14px;color:var(--muted)}
  .queue.has{color:var(--gold);font-weight:700}
  .hide{display:none}
  .coords{font-size:12px;color:var(--muted);text-align:center;margin-top:10px;font-family:monospace}
  #tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:#141a23;border-top:1px solid #2a3340;padding-bottom:env(safe-area-inset-bottom,0)}
  #tabs.hide{display:none}
  #tabs button{flex:1;border:0;background:none;color:var(--muted);padding:9px 0 10px;font-size:20px;display:flex;flex-direction:column;align-items:center;gap:2px}
  #tabs button span{font-size:11px;font-weight:700}
  #tabs button.on{color:var(--gold)}
  .jb{background:#0f141b;border:1px solid #2a3340;border-radius:12px;padding:12px;margin-bottom:10px}
  .jb.urgent{border-color:#7a2a2a}
  .jb .t{display:flex;gap:8px;align-items:baseline}
  .jb .t b{font-size:16px}
  .jb .t .st{margin-left:auto;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:#24324a;color:#9fc0ff;white-space:nowrap}
  .jb .t .st.dispatched,.jb .t .st.in_progress{background:#3d2c08;color:#ffcf6e}.jb .t .st.resolved{background:#0f3a33;color:#7ee0c8}
  .jb .m{font-size:13px;color:#cfd6e0;margin:4px 0}
  .jb .m a{color:#9fc0ff;text-decoration:none;font-weight:700}
  .jb .i{font-size:14px;margin:6px 0;color:#fff}
  .jb .n{font-size:12px;color:var(--muted);white-space:pre-line}
  .jb .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .jb .acts button{flex:1;min-width:120px;border:0;border-radius:11px;padding:12px;font-weight:800;font-size:14px;cursor:pointer}
  .jb .a1{background:var(--blue);color:#fff}.jb .a2{background:var(--teal);color:#fff}.jb .a3{background:#2a3340;color:#cfd6e0}
  .jb textarea{width:100%;min-height:60px;border-radius:10px;border:1.5px solid #2a3340;background:#0f141b;color:#fff;font-size:15px;padding:10px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <svg width="56" height="56" viewBox="0 0 100 100" style="margin-bottom:6px;">
      <ellipse cx="50" cy="50" rx="48" ry="48" fill="#1a2340"/>
      <path d="M10,35 Q30,20 50,28 Q70,36 90,22" stroke="#F5C518" stroke-width="8" fill="none" stroke-linecap="round"/>
      <path d="M8,47 Q28,31 50,40 Q72,49 92,34" stroke="#4ade80" stroke-width="8" fill="none" stroke-linecap="round"/>
      <path d="M6,58 Q27,42 50,51 Q73,60 94,45" stroke="#60a5fa" stroke-width="8" fill="none" stroke-linecap="round"/>
      <path d="M8,69 Q28,53 50,62 Q72,71 92,57" stroke="#a78bfa" stroke-width="8" fill="none" stroke-linecap="round"/>
    </svg>
    <div>SPAWN <span>JOBS</span></div>
    <div class="logo-sub">by Spawn Internet</div>
  </div>

  <!-- LOGIN (one login for jobs, petty cash, keys, tracking) -->
  <div id="setup" class="card">
    <label>Your name</label>
    <select id="lg-name"><option value="">Loading…</option></select>
    <label>PIN</label>
    <input id="lg-pin" type="password" inputmode="numeric" maxlength="6" placeholder="Your PIN" autocomplete="off">
    <button class="btn btn-start" id="begin-btn">Log in</button>
    <div id="lg-msg" style="text-align:center;font-size:13px;margin-top:10px;color:#ff8a8a;font-weight:700"></div>
    <div style="text-align:center;font-size:12px;color:var(--muted);margin-top:8px">No PIN yet? Ask Sir Wendell.</div>
  </div>

  <div id="who" class="hide"><div style="display:flex;align-items:center;gap:10px;margin:-8px 0 14px">
    <span style="font-weight:800">👷 <span id="who-name"></span></span>
    <button id="lg-out" style="margin-left:auto;border:1px solid #2a3340;background:#1a212c;color:#cfd6e0;border-radius:10px;padding:7px 12px;font-weight:700">Log out</button>
  </div></div>

  <!-- MY JOBS -->
  <div id="jobs-card" class="card hide">
    <div style="display:flex;align-items:center;margin-bottom:12px"><label style="margin:0">🛠 My jobs</label>
      <button id="jb-ref" style="margin-left:auto;border:1px solid #2a3340;background:#0f141b;color:#cfd6e0;border-radius:10px;padding:7px 10px;font-weight:700">↻</button></div>
    <div id="jb-body"><div style="color:var(--muted);text-align:center">Loading…</div></div>
  </div>

  <!-- TRACKING -->
  <div id="tracking" class="card hide">
    <div class="status">
      <div class="big"><span class="dot off" id="dot"></span><span id="state">Stopped</span></div>
    </div>
    <button class="btn btn-start" id="toggle-btn">Start Tracking</button>
    <div class="grid">
      <div class="stat"><div class="v" id="sent-n">0</div><div class="l">Sent</div></div>
      <div class="stat"><div class="v" id="acc">–</div><div class="l">Accuracy m</div></div>
    </div>
    <div class="queue" id="queue">All synced</div>
    <div class="coords" id="coords"></div>
  </div>

  <!-- VENDO KEYS -->
  <div id="keys-card" class="card hide">
    <label>🔑 Vendo Keys</label>
    <input id="vk-q" placeholder="Search vendo name…" autocomplete="off">
    <div id="vk-res"></div>
    <div id="vk-detail" class="hide">
      <div id="vk-title" style="font-weight:800;font-size:16px;margin:6px 0 10px;color:var(--gold)"></div>
      <div id="vk-latest" style="margin-bottom:12px"></div>
      <div id="vk-history" style="margin-bottom:14px"></div>
      <label>Log key / padlock change (gi-ilisan — replacement)</label>
      <select id="vk-type">
        <option value="coin_original">🪙 Coin Key — Original</option>
        <option value="board">🔌 Board Key</option>
      </select>
      <input id="vk-notes" placeholder="Notes (optional)">
      <button class="btn btn-start" id="vk-log-btn" style="font-size:15px;padding:13px">✓ Log Key Change</button>
      <div id="vk-msg" style="text-align:center;font-size:13px;margin-top:10px;color:var(--green);font-weight:700"></div>
    </div>
  </div>

<div id="pc-card" class="card hide">
    <div class="pc-h"><label>💰 Petty cash</label><div class="r" id="pc-hr"></div></div>
    <div id="pc-body"><div class="pc-none">Loading…</div></div>
  </div>
  <div style="height:70px"></div>
</div>
<nav id="tabs" class="hide">
  <button data-tab="jobs-card">🛠<span>Jobs</span></button><button data-tab="pc-card">💰<span>Petty cash</span></button>
  <button data-tab="keys-card">🔑<span>Keys</span></button><button data-tab="tracking">📍<span>Tracking</span></button>
</nav>

<script>
// ============================================================
// SECURITY: no service_role key in this file.
// Every Supabase call below is transparently rerouted through the
// spawn-gw-field edge function, which holds the service key server
// side and enforces a narrow table + method allow-list.
// The browser holds only the shared field token.
//
// NOTE: this is spawn-gw-FIELD, a separate function from spawn-gw.
// harvest_v3 talks to spawn-gw and is untouched by this change.
// ============================================================
const SB  = 'https://cviraqfhphhsonjmrtvu.supabase.co';
const KEY = 'gw';
(function installFieldGateway(){
  const GW    = SB + '/functions/v1/spawn-gw-field';
  const TOKEN = 'X7mP92QaL4nVz81TkR6wHy53BcN9Df28JsM1Er5U';
  const _f    = window.fetch.bind(window);
  const RPC_RE  = /\/rest\/v1\/rpc\/([a-z_0-9]+)$/;
  const REST_RE = /\/rest\/v1\/([a-z_0-9]+)(\?([^#]*))?$/;
  const post = (payload) => _f(GW, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'x-gw-token':TOKEN },
    body: JSON.stringify(payload)
  });
  window.fetch = function(input, init){
    try{
      const url  = (typeof input === 'string') ? input : (input && input.url) || '';
      const o    = init || {};
      const h    = o.headers || {};
      if (url.indexOf(SB) === 0 && (h.apikey === 'gw' || h['x-spawn-gw'] === '1')) {
        const method = (o.method || 'GET').toUpperCase();
        const body   = o.body ? JSON.parse(o.body) : undefined;
        const rpcm = url.match(RPC_RE);
        if (rpcm) return post({ kind:'rpc', fn: rpcm[1], body });
        const m = url.match(REST_RE);
        if (m) return post({ kind:'rest', table:m[1], method, query:m[3] || '', body,
                             prefer: h['Prefer'] || h['prefer'] || '' });
      }
    }catch(e){ console.warn('[GW-FIELD] passthrough:', e && e.message); }
    return _f(input, init);
  };
})();
const HDR = {'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'};
const PING_MS = 15000;            // ping every 15s
const QKEY = 'spawn_gps_queue';   // offline queue

let tech = localStorage.getItem('spawn_lineman') || '';
let watchId = null, timer = null, lastFix = null, sentCount = 0;

const $ = id => document.getElementById(id);

// ---------- one login: name + PIN (same PIN as petty cash) ----------
const PCK = 'spawn_pc_login';
const PSB2 = 'https://cviraqfhphhsonjmrtvu.supabase.co', PKEY2 = 'sb_publishable_6J1xIrlkpHf6jir4DtUh4g_xX7Fm9ln';
async function prpc(fn, args){
  let r; try { r = await window.fetch(`${PSB2}/rest/v1/rpc/${fn}`, { method:'POST', headers:{ apikey:PKEY2, 'Content-Type':'application/json' }, body:JSON.stringify(args || {}) }); }
  catch (e) { throw new Error('No signal. Try again.'); }
  let j = null; try { j = await r.json(); } catch (e) {}
  const m = String(j && (j.message || j.error) || '');
  if (!r.ok || (j && j.ok === false)) throw new Error(/bad_pin/.test(m) ? 'Wrong name or PIN.' : /too_many/.test(m) ? 'Too many wrong PINs. Wait 10 minutes.' : (m || 'Error ' + r.status));
  return j;
}
async function loadTechs(){
  try{
    const names = await prpc('pc_roster', {});
    $('lg-name').innerHTML = '<option value="">— Select your name —</option>' + names.map(n => `<option ${n.toLowerCase() === (tech || '').toLowerCase() ? 'selected' : ''}>${n}</option>`).join('');
  }catch(e){ $('lg-name').innerHTML = '<option value="">⚠ No signal — try again</option>'; }
}
function showTab(id){
  ['jobs-card','pc-card','keys-card','tracking'].forEach(x => $(x).classList.toggle('hide', x !== id));
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === id));
  try { localStorage.setItem('spawn_tab', id); } catch (e) {}
  if (id === 'jobs-card' && window.jbLoad) window.jbLoad();
  if (id === 'pc-card' && window.pcStart) window.pcStart(JSON.parse(localStorage.getItem(PCK) || 'null'));
}
function enterApp(login){
  tech = login.name; localStorage.setItem('spawn_lineman', tech); localStorage.setItem(PCK, JSON.stringify(login));
  $('setup').classList.add('hide'); $('who').classList.remove('hide'); $('who-name').textContent = tech; $('tabs').classList.remove('hide');
  let t = 'jobs-card'; try { t = localStorage.getItem('spawn_tab') || t; } catch (e) {}
  showTab(['jobs-card','pc-card','keys-card','tracking'].includes(t) ? t : 'jobs-card');
}
document.querySelectorAll('#tabs button').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));
$('begin-btn').addEventListener('click', async () => {
  const name = $('lg-name').value, pin = $('lg-pin').value.trim(); $('lg-msg').textContent = '';
  if (!name || !pin) { $('lg-msg').textContent = 'Pick your name and type your PIN.'; return; }
  $('begin-btn').disabled = true;
  try { const me = await prpc('pc_me', { p_name:name, p_pin:pin }); enterApp({ name:me.name, pin }); }
  catch (e) { $('lg-msg').textContent = e.message; }
  $('begin-btn').disabled = false;
});
$('lg-pin').addEventListener('keydown', e => { if (e.key === 'Enter') $('begin-btn').click(); });
$('lg-out').addEventListener('click', () => {
  if (watchId) stop(); localStorage.removeItem(PCK); if (window.pcStop) window.pcStop();
  $('who').classList.add('hide'); $('tabs').classList.add('hide'); ['jobs-card','pc-card','keys-card','tracking'].forEach(x => $(x).classList.add('hide'));
  $('setup').classList.remove('hide'); $('lg-pin').value = ''; loadTechs();
});

// ---------- offline queue ----------
function getQ(){ try{return JSON.parse(localStorage.getItem(QKEY)||'[]')}catch{return[]} }
function setQ(q){ localStorage.setItem(QKEY, JSON.stringify(q)); renderQ(); }
function renderQ(){
  const n = getQ().length, el = $('queue');
  if(n>0){ el.textContent = `⚡ ${n} ping${n>1?'s':''} waiting to sync`; el.className='queue has'; }
  else { el.textContent = '✅ All synced'; el.className='queue'; }
}

async function flushQ(){
  let q = getQ();
  if(!q.length) return;
  try{
    const r = await fetch(`${SB}/rest/v1/lineman_gps`,{method:'POST',headers:{...HDR,Prefer:'return=minimal'},
      body:JSON.stringify(q)});
    if(r.ok){ sentCount += q.length; $('sent-n').textContent=sentCount; setQ([]); }
  }catch(e){/* still offline */}
}

// ---------- tracking ----------
function onFix(pos){
  const {latitude,longitude,accuracy} = pos.coords;
  lastFix = {technician:tech, lat:latitude, lng:longitude, accuracy_m:Math.round(accuracy), pinged_at:new Date().toISOString()};
  $('acc').textContent = Math.round(accuracy);
  $('coords').textContent = latitude.toFixed(5)+', '+longitude.toFixed(5);
}
async function pushPing(){
  if(!lastFix) return;
  const q = getQ(); q.push({...lastFix, pinged_at:new Date().toISOString()}); setQ(q);
  await flushQ();
}
function start(){
  if(!navigator.geolocation){ alert('GPS not supported on this device'); return; }
  watchId = navigator.geolocation.watchPosition(onFix, err=>{
    $('state').textContent = err.code===1?'Location blocked':'GPS error';
  }, {enableHighAccuracy:true, maximumAge:5000, timeout:20000});
  timer = setInterval(pushPing, PING_MS);
  $('dot').className='dot on'; $('state').textContent='Tracking';
  $('toggle-btn').textContent='Stop Tracking'; $('toggle-btn').className='btn btn-stop';
}
function stop(){
  if(watchId!=null) navigator.geolocation.clearWatch(watchId);
  clearInterval(timer); watchId=null; timer=null; lastFix=null;
  $('dot').className='dot off'; $('state').textContent='Stopped';
  $('toggle-btn').textContent='Start Tracking'; $('toggle-btn').className='btn btn-start';
}
$('toggle-btn').addEventListener('click', ()=> watchId? stop() : start());

window.addEventListener('online', flushQ);
setInterval(flushQ, 30000); // retry queue every 30s

// ---------- vendo keys ----------
const VK_LBL = {coin_original:'🪙 Coin Key — Original', coin_duplicate:'🪙 Coin Key — Duplicate', board:'🔌 Board Key'};
let vkT=null, vkVendo=null;
const vkEsc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

$('vk-q').addEventListener('input', ()=>{
  clearTimeout(vkT);
  const q = $('vk-q').value.trim();
  if(q.length<2){ $('vk-res').innerHTML=''; return; }
  vkT = setTimeout(async ()=>{
    try{
      const enc = encodeURIComponent('*'+q+'*');
      const r = await fetch(`${SB}/rest/v1/vendos?select=id,sheet_name,tg_name,owner_name,area&or=(sheet_name.ilike.${enc},tg_name.ilike.${enc},owner_name.ilike.${enc})&limit=10`,{headers:HDR});
      const rows = await r.json();
      if(!Array.isArray(rows)||!rows.length){ $('vk-res').innerHTML='<div style="font-size:13px;color:var(--muted);padding:6px 2px">No vendo found</div>'; return; }
      $('vk-res').innerHTML = rows.map(v=>{
        const nm = v.sheet_name||v.tg_name||v.owner_name||('#'+v.id);
        return `<div class="vk-hit" data-id="${v.id}" data-name="${vkEsc(nm)}" data-area="${vkEsc(v.area||'')}"
          style="padding:11px 12px;border:1px solid #2a3340;border-radius:10px;margin-bottom:8px;cursor:pointer;background:#0f141b;font-size:14px">
          <b>${vkEsc(nm)}</b>${v.area?` <span style="color:var(--blue);font-size:12px">· ${vkEsc(v.area)}</span>`:''}
        </div>`;
      }).join('');
      document.querySelectorAll('.vk-hit').forEach(el=>el.addEventListener('click',()=>vkPick(el.dataset.id, el.dataset.name, el.dataset.area)));
    }catch(e){ $('vk-res').innerHTML='<div style="font-size:13px;color:var(--red)">Search failed (offline?)</div>'; }
  }, 300);
});

async function vkPick(id, name, area){
  vkVendo = {id:parseInt(id,10), name, area:area||null};
  $('vk-res').innerHTML=''; $('vk-q').value=name; $('vk-msg').textContent='';
  $('vk-detail').classList.remove('hide');
  $('vk-title').textContent = '🔐 '+name+(area?' · '+area:'');
  $('vk-latest').innerHTML = '<div style="font-size:13px;color:var(--muted)">Loading key info…</div>';
  $('vk-history').innerHTML='';
  try{
    const r = await fetch(`${SB}/rest/v1/key_changes?vendo_id=eq.${vkVendo.id}&select=*&order=created_at.desc&limit=25`,{headers:HDR});
    const rows = await r.json();
    const latest = {};
    (Array.isArray(rows)?rows:[]).forEach(x=>{ if(!latest[x.key_type]) latest[x.key_type]=x; });
    const types = ['coin_original','coin_duplicate','board'];
    $('vk-latest').innerHTML = types.map(t=>{
      const L = latest[t];
      return `<div style="background:#0f141b;border:1px solid #2a3340;border-radius:10px;padding:10px 12px;margin-bottom:6px;font-size:13px">
        <b style="color:var(--gold)">${VK_LBL[t]}</b><br>
        ${L ? `Last changed by <b>${vkEsc(L.changed_by)}</b> · ${vkEsc(L.change_date||'')} ${L.remitted?'<span style="color:var(--green);font-weight:700">✅ remitted</span>':'<span style="color:var(--red);font-weight:700">🔴 not remitted</span>'}`
            : '<span style="color:var(--muted)">No change recorded yet</span>'}
      </div>`;
    }).join('');
    if(Array.isArray(rows)&&rows.length){
      $('vk-history').innerHTML = '<div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:6px">History</div>'
        + rows.slice(0,8).map(x=>`<div style="font-size:12px;color:var(--muted);padding:4px 2px;border-bottom:1px solid #232c39">
            ${vkEsc(x.change_date||'')} · ${VK_LBL[x.key_type]||vkEsc(x.key_type)} · 👷 ${vkEsc(x.changed_by)} ${x.remitted?'✅':'🔴'}${x.notes?(' · '+vkEsc(x.notes)):''}
          </div>`).join('');
    }
  }catch(e){ $('vk-latest').innerHTML='<div style="font-size:13px;color:var(--red)">Failed to load (offline?)</div>'; }
}

$('vk-log-btn').addEventListener('click', async ()=>{
  if(!vkVendo){ alert('Search and pick a vendo first'); return; }
  if(!tech){ alert('Log in first'); return; }
  const body = {
    vendo_id:vkVendo.id, vendo_name:vkVendo.name, area:vkVendo.area,
    key_type:$('vk-type').value, changed_by:tech,
    notes:$('vk-notes').value.trim()||null, remitted:false, source:'lineman'
  };
  $('vk-log-btn').disabled = true;
  try{
    const r = await fetch(`${SB}/rest/v1/key_changes`,{method:'POST',headers:{...HDR,Prefer:'return=minimal'},body:JSON.stringify(body)});
    if(!r.ok) throw new Error(await r.text());
    $('vk-notes').value='';

}
function render(){
  const jobs = (J.data && J.data.jobs) || [], live = jobs.filter(j => j.status !== 'resolved' && j.status !== 'cancelled'), done = jobs.filter(j => j.status === 'resolved');
  g('jb-body').innerHTML = (live.length ? live.map(card).join('') : '<div style="color:var(--muted);text-align:center;padding:10px 0">No jobs assigned to you right now.<br><span style="font-size:12px">The office assigns jobs in the Command Center.</span></div>')
    + (done.length ? `<details><summary style="color:var(--muted);font-size:13px;cursor:pointer;margin-top:6px">Done in the last 2 days (${done.length})</summary>${done.map(card).join('')}</details>` : '');
  const B = g('jb-body');
  B.querySelectorAll('[data-ja]').forEach(b => b.onclick = () => act(b.dataset.id, b.dataset.ja, b));
  const ph = g('jb-photo'); if (ph) ph.onchange = () => { J.photo[J.open.id] = ph.files[0] || null; const note = g('jb-note').value; render(); g('jb-note').value = note; };
  const ok = g('jb-ok'); if (ok) ok.onclick = () => finish(ok);
  const cc = g('jb-cancel'); if (cc) cc.onclick = () => { J.open = null; render(); };
}
async function act(id, a, btn){
  if (a === 'done' || a === 'cantfix') { J.open = { id, act:a }; render(); const n = g('jb-note'); if (n) n.focus(); return; }
  const L = login(); btn.disabled = true;
  try { await rpc('lm_job_update', { p_name:L.name, p_pin:L.pin, p_id:id, p_action:a }); await load(); }
  catch (e) { alert(e.message); btn.disabled = false; }
}
async function finish(btn){
  const L = login(), o = J.open, note = g('jb-note').value.trim(), msg = g('jb-msg');
  if (o.act === 'cantfix' && !note) { msg.textContent = ERR.note_required; return; }
  if (J.busy) return; J.busy = true; btn.disabled = true;
  try {
    let path = null; if (J.photo[o.id]) { btn.textContent = 'Sending photo…'; path = await upload(J.photo[o.id]); }
    await rpc('lm_job_update', { p_name:L.name, p_pin:L.pin, p_id:o.id, p_action:o.act, p_note:note || null, p_photo:path });
    delete J.photo[o.id]; J.open = null; await load();
  } catch (e) { msg.textContent = e.message; btn.disabled = false; btn.textContent = 'Try again'; }
  J.busy = false;
}
g('jb-ref').onclick = load;
document.addEventListener('visibilitychange', () => { if (!document.hidden && !g('jobs-card').classList.contains('hide')) load(); });
window.jbLoad = load;
if (!g('jobs-card').classList.contains('hide')) load();
})();
</script>
</body>
