<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8">

<title>Spawn Jobs</title>
<style>
  :root{
    --gold:#F5A623;--teal:#2BA89A;--blue:#3B6FD4;--navy:#2D3547;
    --red:#D63B3B;--green:#15803d;--muted:#8a93a3;--bg:#0f141b;--card:#1a212c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--bg);color:#e8edf3;min-height:100vh;display:flex;flex-direction:column}
  .wrap{flex:1;display:flex;flex-direction:column;padding:20px;max-width:480px;margin:0 auto;width:100%}
  .logo{font-weight:800;font-size:20px;letter-spacing:.5px;text-align:center;margin:8px 0 24px}
  .logo-globe{font-size:36px;margin-bottom:4px}
  .logo-sub{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:1px;margin-top:2px}
  .logo span{color:var(--gold)}
  .logo div:nth-child(2){letter-spacing:2px}
  .card{background:var(--card);border-radius:16px;padding:20px;margin-bottom:16px;border:1px solid #2a3340}
  label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
  select,input{width:100%;padding:14px;border-radius:12px;border:1.5px solid #2a3340;background:#0f141b;color:#fff;font-size:16px;margin-bottom:14px}
  .btn{width:100%;padding:16px;border:none;border-radius:14px;font-size:17px;font-weight:800;cursor:pointer;transition:.15s}
  .btn-start{background:var(--teal);color:#fff}
  .btn-stop{background:var(--red);color:#fff}
  .btn:active{transform:scale(.98)}
  .status{text-align:center;margin:20px 0}
  .dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:middle}
  .dot.on{background:var(--green);box-shadow:0 0 0 0 rgba(21,128,61,.6);animation:pulse 1.6s infinite}
  .dot.off{background:var(--muted)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(21,128,61,.6)}70%{box-shadow:0 0 0 12px rgba(21,128,61,0)}100%{box-shadow:0 0 0 0 rgba(21,128,61,0)}}
  .big{font-size:15px;font-weight:700}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
  .stat{background:#0f141b;border-radius:12px;padding:14px;text-align:center}
  .stat .v{font-size:22px;font-weight:800;color:var(--gold)}
  .stat .l{font-size:11px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.5px}
  .queue{font-size:13px;text-align:center;margin-top:14px;color:var(--muted)}
  .queue.has{color:var(--gold);font-weight:700}
  .hide{display:none}
  .coords{font-size:12px;color:var(--muted);text-align:center;margin-top:10px;font-family:monospace}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <svg width="56" height="56" viewBox="0 0 100 100" style="margin-bottom:6px;">
      <ellipse cx="50" cy="50" rx="48" ry="48" fill="#1a2340"/>
      <path d="M10,35 Q30,20 50,28 Q70,36 90,22" stroke="#F5C518" stroke-width="8" fill="none" stroke-linecap="round"/>
      <path d="M8,47 Q28,31 50,40 Q72,49 92,34" stroke="#4ade80" stroke-width="8" fill="none" stroke-linecap="round"/>

      <path d="M8,69 Q28,53 50,62 Q72,71 92,57" stroke="#a78bfa" stroke-width="8" fill="none" stroke-linecap="round"/>
    </svg>
    <div>SPAWN <span>JOBS</span></div>
    <div class="logo-sub">by Spawn Internet</div>
  </div>

  <!-- SETUP -->
  <div id="setup" class="card">
    <label>Your Name</label>
    <select id="tech-select"><option value="">Loading…</option></select>
    <div id="new-name-wrap" class="hide">
      <label>New lineman name</label>
      <input id="new-name" placeholder="Full name" autocomplete="off">
      <select id="new-area">
        <option value="">Select area</option>
        <option>DIPOLOG</option><option>DAPITAN</option><option>SINDANGAN</option>
        <option>POLANCO</option><option>ROXAS</option><option>SINAMAN</option>
        <option>MINAOG</option><option>MIX AREAS</option>
      </select>
    </div>
    <button class="btn btn-start" id="begin-btn">Continue</button>
  </div>

  <!-- TRACKING -->
  <div id="tracking" class="card hide">
    <div class="status">
      <div class="big"><span class="dot off" id="dot"></span><span id="state">Stopped</span></div>
    </div>
    <button class="btn btn-start" id="toggle-btn">Start Tracking</button>
    <div class="grid">
      <div class="stat"><div class="v" id="sent-n">0</div><div class="l">Sent</div></div>
      <div class="stat"><div class="v" id="acc">–</div><div class="l">Accuracy m</div></div>
    </div>
    <div class="queue" id="queue">All synced</div>
    <div class="coords" id="coords"></div>
  </div>

  <!-- VENDO KEYS -->
  <div id="keys-card" class="card hide">
    <label>🔑 Vendo Keys</label>
    <input id="vk-q" placeholder="Search vendo name…" autocomplete="off">
    <div id="vk-res"></div>
    <div id="vk-detail" class="hide">
      <div id="vk-title" style="font-weight:800;font-size:16px;margin:6px 0 10px;color:var(--gold)"></div>
      <div id="vk-latest" style="margin-bottom:12px"></div>

        <option value="coin_original">🪙 Coin Key — Original</option>
        <option value="board">🔌 Board Key</option>
      </select>
      <input id="vk-notes" placeholder="Notes (optional)">
      <button class="btn btn-start" id="vk-log-btn" style="font-size:15px;padding:13px">✓ Log Key Change</button>
      <div id="vk-msg" style="text-align:center;font-size:13px;margin-top:10px;color:var(--green);font-weight:700"></div>
    </div>
  </div>

<div id="pc-card" class="card hide">
    <div class="pc-h"><label>💰 Petty cash</label><div class="r" id="pc-hr"></div></div>
    <div id="pc-body"><div class="pc-none">Loading…</div></div>
  </div>
</div>

<script>
// ============================================================
// SECURITY: no service_role key in this file.
// Every Supabase call below is transparently rerouted through the
// spawn-gw-field edge function, which holds the service key server
// side and enforces a narrow table + method allow-list.
// The browser holds only the shared field token.
//
// NOTE: this is spawn-gw-FIELD, a separate function from spawn-gw.
// harvest_v3 talks to spawn-gw and is untouched by this change.
// ============================================================
const SB  = 'https://cviraqfhphhsonjmrtvu.supabase.co';
const KEY = 'gw';
(function installFieldGateway(){
  const GW    = SB + '/functions/v1/spawn-gw-field';
  const TOKEN = 'X7mP92QaL4nVz81TkR6wHy53BcN9Df28JsM1Er5U';
  const _f    = window.fetch.bind(window);
  const RPC_RE  = /\/rest\/v1\/rpc\/([a-z_0-9]+)$/;
  const REST_RE = /\/rest\/v1\/([a-z_0-9]+)(\?([^#]*))?$/;
  const post = (payload) => _f(GW, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'x-gw-token':TOKEN },
    body: JSON.stringify(payload)
  });
  window.fetch = function(input, init){
    try{
      const url  = (typeof input === 'string') ? input : (input && input.url) || '';
      const o    = init || {};
      const h    = o.headers || {};
      if (url.indexOf(SB) === 0 && (h.apikey === 'gw' || h['x-spawn-gw'] === '1')) {
        const method = (o.method || 'GET').toUpperCase();
        const body   = o.body ? JSON.parse(o.body) : undefined;
        const rpcm = url.match(RPC_RE);
        if (rpcm) return post({ kind:'rpc', fn: rpcm[1], body });
        const m = url.match(REST_RE);
        if (m) return post({ kind:'rest', table:m[1], method, query:m[3] || '', body,
                             prefer: h['Prefer'] || h['prefer'] || '' });
      }
    }catch(e){ console.warn('[GW-FIELD] passthrough:', e && e.message); }
    return _f(input, init);
  };
})();
const HDR = {'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'};
const PING_MS = 15000;            // ping every 15s
const QKEY = 'spawn_gps_queue';   // offline queue

let tech = localStorage.getItem('spawn_lineman') || '';
let watchId = null, timer = null, lastFix = null, sentCount = 0;

const $ = id => document.getElementById(id);

// ---------- setup ----------
async function loadTechs(){
  try{
    const r = await fetch(`${SB}/rest/v1/technicians?select=name,area&active=eq.true&order=name.asc`,{headers:HDR});
    const rows = await r.json();
    const sel = $('tech-select');
    sel.innerHTML = '<option value="">— Select your name —</option>' +
      rows.map(t=>`<option ${t.name===tech?'selected':''}>${t.name}</option>`).join('') +
      '<option value="__new__">➕ Add new lineman…</option>';
  }catch(e){
    $('tech-select').innerHTML = '<option value="">⚠ offline — type name below</option><option value="__new__">➕ Add new lineman…</option>';
  }
}
$('tech-select').addEventListener('change',e=>{
  $('new-name-wrap').classList.toggle('hide', e.target.value!=='__new__');
});
$('begin-btn').addEventListener('click', async ()=>{
  const sel = $('tech-select').value;
  if(sel==='__new__'){
    const nm = $('new-name').value.trim(), ar = $('new-area').value;
    if(!nm){ alert('Enter a name'); return; }
    try{
      await fetch(`${SB}/rest/v1/technicians`,{method:'POST',headers:{...HDR,Prefer:'return=minimal'},
        body:JSON.stringify({name:nm,area:ar||null,active:true})});
    }catch(e){/* offline: still let them track, will register later */}
    tech = nm;
  } else if(sel){
    tech = sel;
  } else { alert('Pick or add your name'); return; }
  localStorage.setItem('spawn_lineman', tech);
  $('setup').classList.add('hide');
  $('tracking').classList.remove('hide');
  $('keys-card').classList.remove('hide');
});

// ---------- offline queue ----------
function getQ(){ try{return JSON.parse(localStorage.getItem(QKEY)||'[]')}catch{return[]} }
function setQ(q){ localStorage.setItem(QKEY, JSON.stringify(q)); renderQ(); }
function renderQ(){
  const n = getQ().length, el = $('queue');
  if(n>0){ el.textContent = `⚡ ${n} ping${n>1?'s':''} waiting to sync`; el.className='queue has'; }
  else { el.textContent = '✅ All synced'; el.className='queue'; }
}

async function flushQ(){
  let q = getQ();
  if(!q.length) return;
  try{
    const r = await fetch(`${SB}/rest/v1/lineman_gps`,{method:'POST',headers:{...HDR,Prefer:'return=minimal'},
      body:JSON.stringify(q)});
    if(r.ok){ sentCount += q.length; $('sent-n').textContent=sentCount; setQ([]); }
  }catch(e){/* still offline */}
}

// ---------- tracking ----------
function onFix(pos){
  const {latitude,longitude,accuracy} = pos.coords;
  lastFix = {technician:tech, lat:latitude, lng:longitude, accuracy_m:Math.round(accuracy), pinged_at:new Date().toISOString()};
  $('acc').textContent = Math.round(accuracy);
  $('coords').textContent = latitude.toFixed(5)+', '+longitude.toFixed(5);
}
async function pushPing(){
  if(!lastFix) return;
  const q = getQ(); q.push({...lastFix, pinged_at:new Date().toISOString()}); setQ(q);
  await flushQ();
}
function start(){
  if(!navigator.geolocation){ alert('GPS not supported on this device'); return; }
  watchId = navigator.geolocation.watchPosition(onFix, err=>{
    $('state').textContent = err.code===1?'Location blocked':'GPS error';
  }, {enableHighAccuracy:true, maximumAge:5000, timeout:20000});
  timer = setInterval(pushPing, PING_MS);
  $('dot').className='dot on'; $('state').textContent='Tracking';
  $('toggle-btn').textContent='Stop Tracking'; $('toggle-btn').className='btn btn-stop';
}
function stop(){
  if(watchId!=null) navigator.geolocation.clearWatch(watchId);
  clearInterval(timer); watchId=null; timer=null; lastFix=null;
  $('dot').className='dot off'; $('state').textContent='Stopped';
  $('toggle-btn').textContent='Start Tracking'; $('toggle-btn').className='btn btn-start';
}
$('toggle-btn').addEventListener('click', ()=> watchId? stop() : start());

window.addEventListener('online', flushQ);
setInterval(flushQ, 30000); // retry queue every 30s

// ---------- vendo keys ----------
const VK_LBL = {coin_original:'🪙 Coin Key — Original', coin_duplicate:'🪙 Coin Key — Duplicate', board:'🔌 Board Key'};
let vkT=null, vkVendo=null;
const vkEsc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

$('vk-q').addEventListener('input', ()=>{
  clearTimeout(vkT);
  const q = $('vk-q').value.trim();
  if(q.length<2){ $('vk-res').innerHTML=''; return; }
  vkT = setTimeout(async ()=>{
    try{
      const enc = encodeURIComponent('*'+q+'*');
      const r = await fetch(`${SB}/rest/v1/vendos?select=id,sheet_name,tg_name,owner_name,area&or=(sheet_name.ilike.${enc},tg_name.ilike.${enc},owner_name.ilike.${enc})&limit=10`,{headers:HDR});
      const rows = await r.json();
      if(!Array.isArray(rows)||!rows.length){ $('vk-res').innerHTML='<div style="font-size:13px;color:var(--muted);padding:6px 2px">No vendo found</div>'; return; }
      $('vk-res').innerHTML = rows.map(v=>{
        const nm = v.sheet_name||v.tg_name||v.owner_name||('#'+v.id);
        return `<div class="vk-hit" data-id="${v.id}" data-name="${vkEsc(nm)}" data-area="${vkEsc(v.area||'')}"
          style="padding:11px 12px;border:1px solid #2a3340;border-radius:10px;margin-bottom:8px;cursor:pointer;background:#0f141b;font-size:14px">
          <b>${vkEsc(nm)}</b>${v.area?` <span style="color:var(--blue);font-size:12px">· ${vkEsc(v.area)}</span>`:''}
        </div>`;
      }).join('');
      document.querySelectorAll('.vk-hit').forEach(el=>el.addEventListener('click',()=>vkPick(el.dataset.id, el.dataset.name, el.dataset.area)));
    }catch(e){ $('vk-res').innerHTML='<div style="font-size:13px;color:var(--red)">Search failed (offline?)</div>'; }
  }, 300);
});

async function vkPick(id, name, area){
  vkVendo = {id:parseInt(id,10), name, area:area||null};
  $('vk-res').innerHTML=''; $('vk-q').value=name; $('vk-msg').textContent='';
  $('vk-detail').classList.remove('hide');
  $('vk-title').textContent = '🔐 '+name+(area?' · '+area:'');
  $('vk-latest').innerHTML = '<div style="font-size:13px;color:var(--muted)">Loading key info…</div>';
  $('vk-history').innerHTML='';
  try{
    const r = await fetch(`${SB}/rest/v1/key_changes?vendo_id=eq.${vkVendo.id}&select=*&order=created_at.desc&limit=25`,{headers:HDR});
    const rows = await r.json();
    const latest = {};
    (Array.isArray(rows)?rows:[]).forEach(x=>{ if(!latest[x.key_type]) latest[x.key_type]=x; });
    const types = ['coin_original','coin_duplicate','board'];
    $('vk-latest').innerHTML = types.map(t=>{
      const L = latest[t];
      return `<div style="background:#0f141b;border:1px solid #2a3340;border-radius:10px;padding:10px 12px;margin-bottom:6px;font-size:13px">
        <b style="color:var(--gold)">${VK_LBL[t]}</b><br>
        ${L ? `Last changed by <b>${vkEsc(L.changed_by)}</b> · ${vkEsc(L.change_date||'')} ${L.remitted?'<span style="color:var(--green);font-weight:700">✅ remitted</span>':'<span style="color:var(--red);font-weight:700">🔴 not remitted</span>'}`
            : '<span style="color:var(--muted)">No change recorded yet</span>'}
      </div>`;
    }).join('');
    if(Array.isArray(rows)&&rows.length){
      $('vk-history').innerHTML = '<div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:6px">History</div>'
        + rows.slice(0,8).map(x=>`<div style="font-size:12px;color:var(--muted);padding:4px 2px;border-bottom:1px solid #232c39">
            ${vkEsc(x.change_date||'')} · ${VK_LBL[x.key_type]||vkEsc(x.key_type)} · 👷 ${vkEsc(x.changed_by)} ${x.remitted?'✅':'🔴'}${x.notes?(' · '+vkEsc(x.notes)):''}
          </div>`).join('');
    }
  }catch(e){ $('vk-latest').innerHTML='<div style="font-size:13px;color:var(--red)">Failed to load (offline?)</div>'; }
}

$('vk-log-btn').addEventListener('click', async ()=>{
  if(!vkVendo){ alert('Search and pick a vendo first'); return; }
  if(!tech){ alert('Set your name first (Continue button above)'); return; }
  const body = {
    vendo_id:vkVendo.id, vendo_name:vkVendo.name, area:vkVendo.area,
    key_type:$('vk-type').value, changed_by:tech,
    notes:$('vk-notes').value.trim()||null, remitted:false, source:'lineman'
  };
  $('vk-log-btn').disabled = true;
  try{
    const r = await fetch(`${SB}/rest/v1/key_changes`,{method:'POST',headers:{...HDR,Prefer:'return=minimal'},body:JSON.stringify(body)});
    if(!r.ok) throw new Error(await r.text());
    $('vk-notes').value='';
    $('vk-msg').textContent = '✓ Logged! I-remit ang daan nga yabi sa office.';
    vkPick(vkVendo.id, vkVendo.name, vkVendo.area||'');
  }catch(e){ alert('Save failed: '+e.message); }
  $('vk-log-btn').disabled = false;
});

// init
renderQ();
loadTechs();
if(tech){ /* prefill but still require Continue */ }
</script>

<script>
(function(){
'use strict';
// Petty cash talks straight to SPAWN Finance's PIN-checked functions (pc_*), not through the field gateway.
const PSB = 'https://cviraqfhphhsonjmrtvu.supabase.co';
const PKEY = 'sb_publishable_6J1xIrlkpHf6jir4DtUh4g_xX7Fm9ln';
const LS = 'spawn_pc_login';
const el = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const peso = n => (Number(n) < 0 ? '−' : '') + '₱' + Math.abs(Number(n || 0)).toLocaleString('en-PH', {maximumFractionDigits:2});
const num = v => { const n = parseFloat(String(v ?? '').replace(/[,₱\s]/g, '')); return isFinite(n) ? n : 0; };
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-8xxx-xxxxxxxxxxxx'.replace(/x/g, () => (Math.random() * 16 | 0).toString(16)));
const today = () => new Date().toLocaleDateString('en-CA', {timeZone:'Asia/Manila'});
const dl = d => new Date(d + 'T12:00:00Z').toLocaleDateString('en-PH', {month:'short', day:'numeric', timeZone:'UTC'});
const img = p => `${PSB}/storage/v1/object/public/pc-receipts/${p}`;
const ERR = { bad_pin:'Wrong name or PIN.', too_many_attempts:'Too many wrong PINs. Wait 10 minutes.', receipt_or_reason_required:'Take a photo of the receipt, or type why there is none.',
  release_closed:'The office already confirmed this one.', amount_must_be_positive:'Enter the amount.', what_required:'Type what you bought.', release_not_found:'This cash is not on your account.' };
const st = { login:null, me:null, form:{}, busy:false };
try { st.login = JSON.parse(localStorage.getItem(LS) || 'null'); } catch (e) {}

async function rpc(fn, args){
  let r; try { r = await fetch(`${PSB}/rest/v1/rpc/${fn}`, { method:'POST', headers:{ apikey:PKEY, 'Content-Type':'application/json' }, body:JSON.stringify(args || {}) }); }
  catch (e) { throw new Error('No signal. Nothing was lost; try again.'); }
  let j = null; try { j = await r.json(); } catch (e) {}
  const m = j && (j.message || j.error || '');
  if (!r.ok || (j && j.ok === false)) { const k = Object.keys(ERR).find(x => String(m).includes(x)); throw new Error(k ? ERR[k] : (m || 'Error ' + r.status)); }
  return j;
}
async function shrink(file){
  const im = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error('Could not read that photo.')); i.src = URL.createObjectURL(file); });
  const s = Math.min(1, 1280 / Math.max(im.naturalWidth, im.naturalHeight)), c = document.createElement('canvas');
  c.width = Math.round(im.naturalWidth * s); c.height = Math.round(im.naturalHeight * s); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
  return await new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.72));
}
async function upload(file){
  const blob = await shrink(file), path = `${today().slice(0, 7)}/${uid()}.jpg`;
  let r; try { r = await fetch(`${PSB}/storage/v1/object/pc-receipts/${path}`, { method:'POST', headers:{ apikey:PKEY, 'Content-Type':'image/jpeg' }, body:blob }); }
  catch (e) { throw new Error('No signal. The photo was not sent; try again.'); }
  if (!r.ok) throw new Error('Photo upload failed (' + r.status + '). Try again.');
  return path;
}
let qrLib = null;
function loadQR(){ return qrLib || (qrLib = new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js'; s.onload = () => ok(window.qrcode); s.onerror = () => no(); document.head.appendChild(s); })); }
async function drawQR(code){
  try { const q = (await loadQR())(0, 'M'); q.addData('SPAWNPC:' + code); q.make(); const box = el('pc-qrimg'); if (box) box.innerHTML = q.createImgTag(4, 0); }
  catch (e) { const box = el('pc-qrimg'); if (box) box.textContent = ''; }
}

async function loadRoster(){ try { return await rpc('pc_roster', {}); } catch (e) { return []; } }
async function showLogin(msg){
  el('pc-hr').innerHTML = '';
  const names = await loadRoster(), pre = (st.login && st.login.name) || (typeof tech === 'string' ? tech : '') || '';
  el('pc-body').innerHTML = `<div style="font-size:13px;color:var(--muted);margin-bottom:10px">Cash from the office for gas, materials, errands. Upload each receipt here.</div>
    <select id="pc-name"><option value="">— Your name —</option>${names.map(n => `<option ${n.toLowerCase() === pre.toLowerCase() ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>
    <input id="pc-pin" type="password" inputmode="numeric" maxlength="6" placeholder="Your PIN" autocomplete="off">
    <button class="btn btn-start" id="pc-go" style="font-size:15px;padding:13px">Open my petty cash</button><div class="pc-msg" id="pc-lmsg">${esc(msg || '')}</div>`;
  el('pc-go').onclick = async () => {
    const name = el('pc-name').value, pin = el('pc-pin').value.trim();
    if (!name || !pin) { el('pc-lmsg').textContent = 'Pick your name and type your PIN.'; return; }
    el('pc-go').disabled = true;
    try { st.me = await rpc('pc_me', { p_name:name, p_pin:pin }); st.login = { name:st.me.name, pin }; localStorage.setItem(LS, JSON.stringify(st.login)); render(); }
    catch (e) { el('pc-lmsg').textContent = e.message; el('pc-go').disabled = false; }
  };
  el('pc-pin').onkeydown = e => { if (e.key === 'Enter') el('pc-go').click(); };
}
async function refresh(){
  if (!st.login) return showLogin();
  try { st.me = await rpc('pc_me', { p_name:st.login.name, p_pin:st.login.pin }); render(); }
  catch (e) { if (/PIN/.test(e.message)) { localStorage.removeItem(LS); st.login = null; return showLogin(e.message); } el('pc-body').innerHTML = `<div class="pc-msg">${esc(e.message)}</div>`; }
}
function relHtml(r){
  const live = r.status !== 'closed' && r.status !== 'void', due = Number(r.amount) - Number(r.spent), F = st.form[r.id] || {};
  const label = ({open:'Not liquidated', uploaded:'Receipts uploaded', flagged:'Needs attention', closed:'Confirmed'})[r.status] || r.status;
  let h = `<div class="pc-rel ${r.status === 'flagged' ? 'flag' : ''}"><div class="t"><b>${peso(r.amount)}</b><span>${esc(r.pcv_no)} · ${esc(dl(r.release_date))}</span><span class="st ${r.status}">${label}</span></div>
    ${r.purpose ? `<div class="p">${esc(r.purpose)}</div>` : ''}${live && r.flag_reason ? `<div class="f">⚠ ${esc(r.flag_reason)}</div>` : ''}
    <div class="s"><span>Spent <b>${peso(r.spent)}</b></span><span>${due >= 0 ? 'Change to return' : 'Office owes you'} <b>${peso(Math.abs(due))}</b></span></div>`;
  h += (r.expenses || []).map(e => `<div class="pc-e">${e.receipt_path ? `<a href="${img(e.receipt_path)}" target="_blank" rel="noopener"><img src="${img(e.receipt_path)}" alt="Receipt"></a>` : '<span class="n">no receipt</span>'}
    <span>${esc(e.what)}<small>${esc(dl(e.date))}${e.no_receipt_reason ? ' · ' + esc(e.no_receipt_reason) : ''}</small></span><b>${peso(e.amount)}</b>${live && e.by_self ? `<button data-pcx="${e.id}" aria-label="Remove">✕</button>` : '<span></span>'}</div>`).join('');
  if (live) h += `<div class="pc-add"><div class="pc-chips">${['Gas','Snack','Fiber','Connector','Fare','Materials'].map(c => `<button data-pcc="${r.id}" data-v="${c}">${c}</button>`).join('')}</div>
    <input data-pcw="${r.id}" placeholder="What did you buy?" value="${esc(F.what || '')}" autocomplete="off">
    <input data-pca="${r.id}" inputmode="decimal" placeholder="Amount ₱" value="${esc(F.amt || '')}">
    <label class="pc-ph ${F.file ? 'ok' : ''}">📷 ${F.file ? 'Receipt photo ready ✓' : 'Take photo of receipt'}<input data-pcf="${r.id}" type="file" accept="image/*" capture="environment" style="display:none"></label>
    <input data-pcn="${r.id}" placeholder="No receipt? Type why" value="${esc(F.nor || '')}" autocomplete="off">
    <button class="btn btn-start" data-pcs="${r.id}" style="font-size:15px;padding:13px">＋ Add expense</button><div class="pc-msg" id="pcm-${r.id}"></div></div>`;
  return h + '</div>';
}
function render(){
  const m = st.me; if (!m) return;
  el('pc-hr').innerHTML = `<button class="pc-sm" id="pc-ref">↻</button><button class="pc-sm" id="pc-out">Log out</button>`;
  el('pc-ref').onclick = refresh; el('pc-out').onclick = () => { localStorage.removeItem(LS); st.login = null; st.me = null; showLogin(); };
  const rel = m.releases || [], live = rel.filter(r => r.status !== 'closed' && r.status !== 'void'), done = rel.filter(r => r.status === 'closed');
  const owe = live.reduce((s, r) => s + Number(r.amount) - Number(r.spent), 0);
  el('pc-body').innerHTML = `<div class="pc-qr"><div class="q" id="pc-qrimg"></div><div><b>${esc(m.code)}</b><small>${esc(m.name)} · show this at the office when you bring the receipts and change.</small>
      ${live.length ? `<small style="color:#ffcf6e;font-weight:700">To liquidate: ${live.length} · ${owe >= 0 ? 'change' : 'office owes you'} ${peso(Math.abs(owe))}</small>` : ''}</div></div>
    ${live.length ? live.map(relHtml).join('') : '<div class="pc-none">No petty cash with you right now.</div>'}
    ${done.length ? `<details><summary style="color:var(--muted);font-size:13px;cursor:pointer;margin-top:6px">Confirmed by the office (${done.length})</summary>${done.map(relHtml).join('')}</details>` : ''}`;
  drawQR(m.code);
  const B = el('pc-body');
  B.querySelectorAll('[data-pcc]').forEach(b => b.onclick = () => { const w = B.querySelector(`[data-pcw="${b.dataset.pcc}"]`); w.value = b.dataset.v + (w.value && !w.value.startsWith(b.dataset.v) ? ' ' + w.value : ''); keep(b.dataset.pcc); B.querySelector(`[data-pca="${b.dataset.pcc}"]`).focus(); });
  B.querySelectorAll('[data-pcw],[data-pca],[data-pcn]').forEach(i => i.oninput = () => keep(i.dataset.pcw || i.dataset.pca || i.dataset.pcn));
  B.querySelectorAll('[data-pcf]').forEach(i => i.onchange = () => { const id = i.dataset.pcf; keep(id); st.form[id].file = i.files[0] || null; st.form[id].path = null; render(); });
  B.querySelectorAll('[data-pcs]').forEach(b => b.onclick = () => addExp(+b.dataset.pcs, b));
  B.querySelectorAll('[data-pcx]').forEach(b => b.onclick = async () => { if (!confirm('Remove this expense?')) return; try { await rpc('pc_my_exp_void', { p_name:st.login.name, p_pin:st.login.pin, p_id:+b.dataset.pcx }); refresh(); } catch (e) { alert(e.message); } });
}
function keep(id){ const B = el('pc-body'), F = st.form[id] = st.form[id] || {}, q = s => B.querySelector(s);
  if (q(`[data-pcw="${id}"]`)) F.what = q(`[data-pcw="${id}"]`).value; if (q(`[data-pca="${id}"]`)) F.amt = q(`[data-pca="${id}"]`).value; if (q(`[data-pcn="${id}"]`)) F.nor = q(`[data-pcn="${id}"]`).value; }
async function addExp(id, btn){
  keep(id); const F = st.form[id], msg = el('pcm-' + id);
  const amt = num(F.amt), what = (F.what || '').trim(), nor = (F.nor || '').trim();
  if (!what) { msg.textContent = ERR.what_required; return; } if (!(amt > 0)) { msg.textContent = ERR.amount_must_be_positive; return; }
  if (!F.file && !nor) { msg.textContent = ERR.receipt_or_reason_required; return; }
  if (st.busy) return; st.busy = true; btn.disabled = true; btn.textContent = F.file ? 'Sending photo…' : 'Saving…';
  try {
    if (F.file && !F.path) F.path = await upload(F.file);
    F.cid = F.cid || uid();
    await rpc('pc_my_exp_add', { p_name:st.login.name, p_pin:st.login.pin, p_client_id:F.cid, p_release_id:id, p_amount:amt, p_what:what, p_receipt_path:F.path || null, p_no_receipt:nor || null });
    delete st.form[id]; await refresh();
  } catch (e) { msg.textContent = e.message; btn.disabled = false; btn.textContent = '＋ Try again'; }
  st.busy = false;
}

// show the card once the lineman has picked his name (and right away if he already did before)
function reveal(){ el('pc-card').classList.remove('hide'); refresh(); }
const begin = el('begin-btn'); if (begin) begin.addEventListener('click', () => setTimeout(() => { if (el('setup').classList.contains('hide')) reveal(); }, 0));
document.addEventListener('visibilitychange', () => { if (!document.hidden && st.me) refresh(); });
window.pcReveal = reveal;
})();
</script>
