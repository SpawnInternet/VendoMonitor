<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SPAWN Finance</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2D3547">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SPAWN Finance">
<!-- SPAWN Finance v1.0 · 2026-10-07 · cash book -->
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#2D3547; --ink-2:#4A5468; --muted:#6B7280; --line:#E3E8F0; --bg:#EEF2F7; --card:#fff;
  --gold:#F5A623; --gold-l:#FEF4E1; --teal:#2BA89A; --teal-l:#E3F5F2; --blue:#3B6FD4; --blue-l:#EAF0FB;
  --purple:#7B4FA6; --purple-l:#F2ECF8; --pink:#D4458A; --pink-l:#FBEAF2; --red:#D63B3B; --red-l:#FDEDED;
  --rule:#DCE6F4; --margin:#F1B7B7;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.hide{display:none!important}

/* top bar + Spawn stripe */
.bar{position:sticky;top:0;z-index:50;background:var(--ink);color:#fff;padding:calc(var(--safe-t) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
.bar h1{font-size:16px;font-weight:800;letter-spacing:.01em;flex:1}
.bar h1 small{display:block;font-size:11px;font-weight:600;opacity:.65;letter-spacing:0}
.bar .chip{background:rgba(255,255,255,.14);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700;color:#fff}
.stripe{display:flex;height:4px}.stripe i{flex:1}
.stripe i:nth-child(1){background:var(--gold)}.stripe i:nth-child(2){background:var(--teal)}.stripe i:nth-child(3){background:var(--blue)}.stripe i:nth-child(4){background:var(--purple)}.stripe i:nth-child(5){background:var(--pink)}
.wrap{max-width:480px;margin:0 auto;padding:16px 16px calc(var(--safe-b) + 28px)}

/* PIN */
.pin{max-width:340px;margin:28px auto 0;padding:0 16px;text-align:center}
.pin h2{font-size:24px;font-weight:900}
.pin p{color:var(--muted);font-size:13px;margin-top:4px}
.accs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:22px 0 6px}
.acc{padding:9px 16px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-weight:700;font-size:14px}
.acc.on{background:var(--ink);border-color:var(--ink);color:#fff}
.dots{display:flex;justify-content:center;gap:14px;margin:18px 0 16px}
.dots i{width:15px;height:15px;border-radius:50%;background:var(--line);transition:background .15s}
.dots i.on{background:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:62px;border-radius:14px;background:#fff;font-size:24px;font-weight:700;box-shadow:0 1px 0 var(--line)}
.pad button:active{background:var(--line)}
.pad .ghost{background:transparent;box-shadow:none;font-size:15px;color:var(--muted)}
.err{color:var(--red);font-weight:700;font-size:13px;min-height:20px;margin-top:12px}

/* home */
.cash{background:#fff;border-radius:18px;padding:18px 18px 14px;border:1px solid var(--line)}
.cash .lbl{font-size:13px;color:var(--muted);font-weight:600}
.cash .amt{font-size:40px;font-weight:900;letter-spacing:-.02em;line-height:1.1;margin-top:2px}
.cash .amt small{font-size:22px;font-weight:800;margin-right:2px;color:var(--ink-2)}
.cash .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--bg);color:var(--ink-2)}
.pill.in{background:var(--teal-l);color:#1d7a70}.pill.out{background:var(--red-l);color:#b02a2a}.pill.warn{background:var(--gold-l);color:#9a6408}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tile{text-decoration:none;border-radius:14px;padding:12px;min-height:92px;color:#fff;text-align:left;display:flex;flex-direction:column;justify-content:space-between;position:relative}
.tile b{font-size:15px;font-weight:800;line-height:1.2}
.tile span{font-size:12px;opacity:.85}
.tile svg{width:24px;height:24px}
.tile.small{min-height:64px;flex-direction:row;align-items:center;gap:10px;justify-content:flex-start}
.tile.small svg{flex:none}
.t-col{background:var(--teal)}.t-exp{background:var(--pink)}.t-cnt{background:var(--gold);color:#3d2a06}.t-dep{background:var(--blue)}
.t-adv{background:var(--purple)}.t-book{background:var(--ink)}.t-close{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.t-sc{background:#fff;color:var(--blue);border:1.5px solid var(--blue-l)}.t-own{background:#fff;color:var(--ink-2);border:1.5px dashed #c5cdd9}
.tile.wide{grid-column:1/-1}
.sec{font-size:13px;font-weight:800;color:var(--ink-2);margin:20px 2px 8px}
.owed{background:#fff;border:1px solid var(--line);border-radius:14px}
.owed div{display:flex;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--line);font-size:14px}
.owed div:first-child{border-top:0}
.empty{color:var(--muted);font-size:13px;padding:12px 14px}

/* book: the office notebook */
.range{display:flex;gap:6px;margin-bottom:12px}
.range button{padding:7px 13px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-size:13px;font-weight:700}
.range button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.range label{margin-left:auto;font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.page{background:#fff;border-radius:6px 14px 14px 6px;margin-bottom:16px;position:relative;overflow:hidden;
  background-image:linear-gradient(to right,transparent 30px,var(--margin) 30px,var(--margin) 31.5px,transparent 31.5px);
  box-shadow:0 1px 0 var(--line), 0 6px 18px -12px rgba(45,53,71,.35)}
.page-hd{display:flex;align-items:baseline;justify-content:space-between;padding:12px 14px 8px 42px;border-bottom:2px solid var(--ink)}
.page-hd h3{font-size:16px;font-weight:900}
.stamp{font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px;border:1.5px solid currentColor}
.stamp.closed{color:var(--teal)}.stamp.open{color:var(--gold)}
.ln{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:baseline;padding:9px 12px 9px 42px;border-bottom:1px solid var(--rule);width:100%;text-align:left}
.ln .d{font-size:14px;font-weight:600;min-width:0}
.ln .d small{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:1px;overflow-wrap:anywhere}
.ln .a{font-size:14px;font-weight:800;text-align:right;white-space:nowrap}
.ln .a.in{color:#1d7a70}.ln .a.out{color:#b02a2a}
.ln .b{font-size:14px;font-weight:700;min-width:76px;text-align:right;color:var(--ink-2);white-space:nowrap}
.ln.void .d,.ln.void .a{text-decoration:line-through;opacity:.5}.ln.void .b{opacity:0}
.box{margin:8px 12px 8px 42px;border:2px solid var(--gold);border-radius:8px;padding:8px 10px;display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--gold-l);width:calc(100% - 54px);text-align:left}
.box .d{font-size:13px;font-weight:700}.box .d small{display:block;font-weight:500;color:var(--ink-2);font-size:12px}
.box .a{font-size:16px;font-weight:900;white-space:nowrap}
.box.closing{border-color:var(--ink);background:#fff}
.box.void{opacity:.45;text-decoration:line-through}
.diff0{color:#1d7a70}.diffx{color:#b02a2a}
.carry{padding:8px 12px 10px 42px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between}
.carry b{color:var(--ink)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(45,53,71,.45);z-index:90;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:100;background:#fff;border-radius:20px 20px 0 0;max-height:92vh;overflow:auto;
  transform:translateY(105%);transition:transform .25s ease;padding:0 18px calc(var(--safe-b) + 18px);max-width:520px;margin:0 auto}
.sheet.on{transform:none}
.sh-hd{position:sticky;top:0;background:#fff;padding:14px 0 10px;display:flex;align-items:center;gap:10px;z-index:2}
.sh-hd h2{font-size:19px;font-weight:900;flex:1}
.sh-hd .x{width:34px;height:34px;border-radius:50%;background:var(--bg);font-size:20px;line-height:1}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px;margin-bottom:14px;overflow-x:auto}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-size:13px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(45,53,71,.15)}
.f{margin-bottom:12px}
.f>label{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:5px}
.f input,.f select,.f textarea{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:11px 12px;font-size:16px;background:#fff}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--ink);outline:none}
.f input.money{font-size:22px;font-weight:800}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:8px 12px;border-radius:999px;border:1.5px solid var(--line);font-size:13px;font-weight:700;background:#fff}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.recon{border:1.5px dashed var(--blue);background:var(--blue-l);color:#244c9c;border-radius:12px;padding:9px 11px;text-align:left;font-size:13px;font-weight:700;display:block;width:100%;margin-bottom:6px}
.recon.on{border-style:solid;background:var(--blue);color:#fff}
.calc{background:var(--bg);border-radius:12px;padding:10px 12px;margin:4px 0 12px}
.calc div{display:flex;justify-content:space-between;font-size:14px;padding:3px 0}
.calc div b{font-weight:800}
.calc .big{font-size:16px;border-top:1px solid #d6dde8;margin-top:4px;padding-top:7px}
.go{width:100%;padding:15px;border-radius:14px;background:var(--ink);color:#fff;font-size:16px;font-weight:800;margin-top:6px}
.go:disabled{opacity:.5}
.go.alt{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.go.danger{background:var(--red)}
.msg{font-size:13px;font-weight:700;margin-top:10px;min-height:18px}
.msg.bad{color:var(--red)}.msg.ok{color:#1d7a70}
.note{font-size:13px;color:var(--ink-2);background:var(--gold-l);border-radius:11px;padding:10px 12px;margin-bottom:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin-bottom:14px}
.kv dt{color:var(--muted)}.kv dd{font-weight:700;overflow-wrap:anywhere}

.toast{pointer-events:none;position:fixed;left:50%;top:calc(var(--safe-t) + 62px);transform:translate(-50%,-20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;font-weight:700;opacity:0;transition:.2s;z-index:200;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="bar" id="bar">
  <h1>SPAWN Finance<small id="bar-sub">Cash book</small></h1>
  <button class="chip hide" id="btn-home" type="button">Home</button>
  <button class="chip hide" id="btn-user" type="button"></button>
</header>
<div class="stripe" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>

<!-- PIN -->
<section id="v-pin">
  <div class="pin">
    <h2>Who's counting?</h2>
    <p>Tap your name, then enter your PIN.</p>
    <div class="accs" id="accs"><span class="spin"></span></div>
    <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
    <div class="pad" id="pad"></div>
    <div class="err" id="pin-err" role="alert"></div>
  </div>
</section>

<!-- HOME -->
<section id="v-home" class="hide">
  <div class="wrap">
    <div class="cash">
      <div class="lbl" id="h-lbl">Cash on hand</div>
      <div class="amt" id="h-bal"><small>₱</small>0</div>
      <div class="row" id="h-pills"></div>
    </div>
    <div class="tiles">
      <button class="tile t-col" data-go="collect" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
        <div><b>Record collection</b><br><span>Collector hand-in, office, GCash</span></div></button>
      <button class="tile t-exp" data-go="expense" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        <div><b>Record expense</b><br><span>Gas, supplies, salaries</span></div></button>
      <button class="tile t-cnt" data-go="count" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>
        <div><b>Count / Handover</b><br><span>Check cash against the book</span></div></button>
      <button class="tile t-dep" data-go="deposit" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 10l9-6 9 6M5 10v8M19 10v8M9 10v8M15 10v8M3 20h18"/></svg>
        <div><b>Bank deposit</b><br><span>Slip, bank and days covered</span></div></button>
      <button class="tile t-adv" data-go="advance" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M17 8h4M19 6v4"/></svg>
        <div><b>Cash advance / c/o</b><br><span>Loans, c/o and repayments</span></div></button>
      <button class="tile t-book" data-go="book" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4h11a3 3 0 013 3v13H7a3 3 0 01-3-3z"/><path d="M8 9h6M8 13h6"/></svg>
        <div><b>Book</b><br><span>Running balance, like the notebook</span></div></button>
      <button class="tile t-close wide small" data-go="close" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
        <div><b id="close-lbl">Close day</b><br><span id="close-sub">Final count and PIN sign-off</span></div></button>
      <a class="tile t-sc small" href="https://spawninternet.github.io/VendoMonitor/office.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
        <div><b>Spawn Count</b><br><span>Per-vendo recount</span></div></a>
      <button class="tile t-own small hide" id="tile-owner" data-go="owner" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>
        <div><b>Owner settings</b><br><span>Opening, posting</span></div></button>
    </div>
    <div class="sec">Who owes the office cash</div>
    <div class="owed" id="h-owed"><div class="empty">Nobody owes cash right now.</div></div>
  </div>
</section>

<!-- BOOK -->
<section id="v-book" class="hide">
  <div class="wrap">
    <div class="range" id="range">
      <button type="button" data-r="1">Today</button>
      <button type="button" data-r="7" class="on">7 days</button>
      <button type="button" data-r="31">31 days</button>
      <label><input type="checkbox" id="show-void"> Voided</label>
    </div>
    <div id="book"></div>
  </div>
</section>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title">
  <div class="sh-hd"><h2 id="sh-title"></h2><button class="x" id="sh-x" type="button" aria-label="Close">×</button></div>
  <div id="sh-body"></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
'use strict';
const SB  = 'https://cviraqfhphhsonjmrtvu.supabase.co';
const KEY = 'sb_publishable_6J1xIrlkpHf6jir4DtUh4g_xX7Fm9ln';
const AREAS = ['Dipolog','Dapitan','Sindangan','Sinaman','Roxas','Polanco','Minaog','Gulayon/Igot'];
const BANK_DEFAULTS = ['BDO','Landbank','RCBC','Eastwest','Metrobank','BPI'];
const IDLE_MS = 10 * 60 * 1000;

const S = { user:null, pin:'', name:null, look:null, book:null, range:7, form:null, idle:null };

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(/[₱,\s]/g, '')); return isFinite(n) ? n : 0; };
const peso = n => '₱' + Number(n || 0).toLocaleString('en-PH', {minimumFractionDigits:0, maximumFractionDigits:2});
const pesoS = n => (n > 0 ? '+' : n < 0 ? '−' : '') + peso(Math.abs(n));
const todayPH = () => new Date().toLocaleDateString('en-CA', {timeZone:'Asia/Manila'});
const addDays = (d, n) => { const t = new Date(d + 'T12:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0,10); };
const dLabel = d => new Date(d + 'T12:00:00Z').toLocaleDateString('en-PH', {weekday:'short', month:'short', day:'numeric', timeZone:'UTC'});
const tLabel = ts => ts ? new Date(ts).toLocaleTimeString('en-PH', {hour:'numeric', minute:'2-digit', timeZone:'Asia/Manila'}) : '';
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() :
  'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = crypto.getRandomValues(new Uint8Array(1))[0] & 15; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));
function toast(m, ms = 2600){ const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), ms); }

const ERR = {
  bad_pin:'Wrong PIN. Try again.',
  too_many_attempts:'Too many wrong PINs from this phone. Wait 10 minutes, then try again.',
  day_locked:'That day is already closed. Record this on today instead.',
  already_locked:'This day is already closed.',
  future_date:"The date can't be in the future.",
  amount_must_be_positive:'Enter an amount.',
  collector_required:'Choose the collector.',
  category_required:'Choose a category.',
  party_required:'Enter the person.',
  bank_required:'Enter the bank.',
  owner_only:'Only Sir Wendell can do this.',
  opening_exists:'The opening balance is already set.',
  handed_to_unknown:'Choose who receives the cash.',
  handover_to_self:"You can't hand over to yourself.",
  reason_required:'Write a reason (at least 3 letters).',
  already_voided:'This line is already voided.',
  closing_count_is_locked:'The closing count belongs to a closed day.',
  negative_amount:"Amounts can't be negative.",
  range_too_long:'Pick a shorter date range.',
  not_found:'That line no longer exists. Refresh the book.'
};
function errText(code){
  const c = String(code || '');
  const m = c.match(/^earlier_day_open:\s*(\d{4}-\d{2}-\d{2})/);
  if (m) return `Close ${dLabel(m[1])} first. Days close in order.`;
  return ERR[c] || c || 'Something went wrong.';
}

async function rpc(fn, args = {}){
  let res;
  try {
    res = await fetch(`${SB}/rest/v1/rpc/${fn}`, {
      method:'POST', headers:{ apikey:KEY, 'Content-Type':'application/json' }, body:JSON.stringify(args)
    });
  } catch (e) { const er = new Error('No signal. Nothing was lost — tap Save again when you have signal.'); er.network = true; throw er; }
  let j = null; try { j = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error(errText(j && (j.message || j.hint || j.details)) || ('Error ' + res.status));
  if (j && j.ok === false) {
    if (j.error === 'bad_pin' && S.user && args.p_pin === S.pin) { lockApp('Your PIN changed or the session ended. Log in again.'); }
    throw new Error(errText(j.error));
  }
  return j;
}

/* ---------- PIN ---------- */
let roster = [];
async function loadRoster(){
  try {

}
$('accs').addEventListener('click', e => {
  if (e.target.id === 'retry-roster') return loadRoster();

  document.querySelectorAll('.acc').forEach(x => x.classList.toggle('on', x === b));

});
function drawDots(){ [...$('dots').children].forEach((d, i) => d.classList.toggle('on', i < S.pin.length)); }
$('pad').innerHTML = [1,2,3,4,5,6,7,8,9].map(n => `<button type="button" data-k="${n}">${n}</button>`).join('') +
  '<button type="button" class="ghost" data-k="c">Clear</button><button type="button" data-k="0">0</button><button type="button" class="ghost" data-k="b">⌫</button>';
$('pad').addEventListener('click', e => { const b = e.target.closest('button'); if (b) pinKey(b.dataset.k); });
document.addEventListener('keydown', e => {
  if ($('v-pin').classList.contains('hide')) return;
  if (/^\d$/.test(e.key)) pinKey(e.key); else if (e.key === 'Backspace') pinKey('b');
});
let pinBusy = false;
async function pinKey(k){
  if (pinBusy) return;
  if (!S.name) { $('pin-err').textContent = 'Tap your name first.'; return; }
  if (k === 'c') S.pin = ''; else if (k === 'b') S.pin = S.pin.slice(0, -1); else if (S.pin.length < 4) S.pin += k;
  drawDots();
  if (S.pin.length === 4) {
    pinBusy = true; $('pin-err').innerHTML = '<span class="spin"></span>';
    try {
      const r = await rpc('fin_login', { p_pin:S.pin, p_name:S.name });
      S.user = r; $('pin-err').textContent = '';
      $('btn-user').textContent = r.name + ' · Log out';
      $('tile-owner').classList.toggle('hide', !r.is_owner);
      show('home'); bumpIdle(); await refresh();
    } catch (e) { $('pin-err').textContent = e.message; S.pin = ''; drawDots(); }
    pinBusy = false;
  }
}
function lockApp(msg){
  S.user = null; S.pin = ''; S.book = null; S.look = null; closeSheet(); drawDots();
  document.querySelectorAll('.acc').forEach(x => x.classList.remove('on')); S.name = null;
  show('pin'); $('pin-err').textContent = msg || '';
}
$('btn-user').addEventListener('click', () => lockApp(''));
$('btn-home').addEventListener('click', () => { show('home'); renderHome(); });
function bumpIdle(){ clearTimeout(S.idle); if (S.user) S.idle = setTimeout(() => lockApp('Locked after 10 minutes of no use.'), IDLE_MS); }
['click','keydown','touchstart'].forEach(ev => document.addEventListener(ev, bumpIdle, {passive:true}));

/* ---------- data ---------- */
async function refresh(){
  const t = todayPH();
  const from = addDays(t, -(Math.max(S.range, 31) - 1));
  try {
    const [book, look] = await Promise.all([
      rpc('fin_cash_book', { p_pin:S.pin, p_from:from, p_to:t }),
      rpc('fin_lookups', { p_pin:S.pin })
    ]);
    S.book = book; S.look = look;
  } catch (e) { toast(e.message, 4000); }
  renderHome();
  if (!$('v-book').classList.contains('hide')) renderBook();
}

function openDays(){
  // days with live entries that are not closed, oldest first
  if (!S.book) return [];
  const closed = new Set(S.book.days.filter(d => d.locked_at).map(d => d.entry_date));
  return [...new Set(S.book.entries.map(e => e.entry_date))].filter(d => !closed.has(d)).sort();
}
function balanceAt(date){
  if (!S.book) return 0;
  let b = S.book.opening_balance;
  for (const e of S.book.entries) if (e.entry_date <= date) b = e.running_balance;
  return Number(b);
}

/* ---------- home ---------- */
function renderHome(){
  const B = S.book; if (!B) return;
  const t = todayPH();
  $('h-bal').innerHTML = '<small>₱</small>' + Number(B.balance_now).toLocaleString('en-PH', {maximumFractionDigits:2});
  const todays = B.entries.filter(e => e.entry_date === t);
  const inT = todays.filter(e => e.signed_amount > 0).reduce((s, e) => s + Number(e.signed_amount), 0);
  const outT = todays.filter(e => e.signed_amount < 0).reduce((s, e) => s - Number(e.signed_amount), 0);
  const od = openDays().filter(d => d < t);
  const lastDep = [...B.deposits].filter(d => !d.voided_at).pop();
  let pills = `<span class="pill in">In today ${peso(inT)}</span><span class="pill out">Out today ${peso(outT)}</span>`;
  if (lastDep) pills += `<span class="pill">Last deposit ${peso(lastDep.amount)} · ${dLabel(lastDep.deposit_date)}</span>`;
  if (od.length) pills += `<span class="pill warn">${od.length} day${od.length > 1 ? 's' : ''} not closed</span>`;
  if (!B.entries.length && B.balance_now == 0) pills = `<span class="pill warn">No entries yet. Sir Wendell sets the opening balance first.</span>`;
  $('h-pills').innerHTML = pills;
  const nextClose = openDays()[0] || t;
  $('close-lbl').textContent = nextClose === t ? 'Close today' : 'Close ' + dLabel(nextClose);
  $('close-sub').textContent = nextClose === t ? 'Final count and PIN sign-off' : 'This day is still open. Close it first.';
  $('h-owed').innerHTML = B.owed.length
    ? B.owed.map(o => `<div><span>${esc(o.party)}</span><b>${peso(o.outstanding)}</b></div>`).join('')
    : '<div class="empty">Nobody owes cash right now.</div>';
}
document.querySelector('.tiles').addEventListener('click', e => {
  const b = e.target.closest('[data-go]'); if (!b) return;
  const g = b.dataset.go;
  if (!S.book) { toast('Still loading. Try again in a moment.'); return; }

});

/* ---------- book ---------- */
$('range').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  S.range = +b.dataset.r; document.querySelectorAll('#range button').forEach(x => x.classList.toggle('on', x === b));
  renderBook();
});
$('show-void').addEventListener('change', renderBook);

function lineText(e){
  const k = e.kind, p = e.party ? esc(e.party) : '', m = e.memo ? esc(e.memo) : '';
  switch (k) {
    case 'opening': return ['Opening balance', m];
    case 'collection': {
      let sub = '';
      if (e.harvest_total != null) {
        sub = `harvest ${peso(e.harvest_total)}`;
        if (+e.less_expense) sub += ` − exp ${peso(e.less_expense)}`;
        if (+e.less_bugi) sub += ` − bugi ${peso(e.less_bugi)}`;
        if (e.short_over != null && +e.short_over !== 0) sub += ` · ${+e.short_over < 0 ? 'short' : 'over'} ${peso(Math.abs(e.short_over))}`;
      }
      if (e.recon_id) sub += (sub ? ' · ' : '') + 'from Spawn Count';
      return [`${esc(e.collector)} hand-in`, sub];
    }
    case 'office_collection': return ['Office collection', [p, m].filter(Boolean).join(' · ')];
    case 'gcash_cashout': return ['GCash cash-out', m];
    case 'repay': return [`${p} repaid`, m];
    case 'adjust_in': case 'adjust_out': return ['Adjustment', m];
    case 'other_in': return [m || 'Other cash in', p];
    case 'other_out': return [m || 'Other cash out', p];
    case 'expense': return [m || esc(e.category), [m ? esc(e.category) : '', p].filter(Boolean).join(' · ')];
    case 'advance': return [`Cash advance · ${p}`, m];
    case 'co': return [`c/o · ${p}`, m];
    case 'deposit': return [m || 'Bank deposit', ''];
  }
  return [k, m];
}

function renderBook(){
  const B = S.book; const el = $('book'); if (!B) { el.innerHTML = ''; return; }
  const t = todayPH(), from = addDays(t, -(S.range - 1));
  const showVoid = $('show-void').checked;
  const days = new Map();
  const add = (d, item) => { if (d < from) return; if (!days.has(d)) days.set(d, []); days.get(d).push(item); };
  B.entries.forEach(e => add(e.entry_date, { t:e.entered_at, type:'e', e }));
  if (showVoid) B.voided.forEach(e => add(e.entry_date, { t:e.entered_at, type:'v', e }));
  B.counts.forEach(c => { if (!c.voided_at || showVoid) add(c.entry_date, { t:c.counted_at, type:'c', c }); });
  const locks = new Map(B.days.map(d => [d.entry_date, d]));
  if (!days.size) { el.innerHTML = '<div class="page"><div class="empty" style="padding:22px 14px 22px 42px">No lines in this range. Record a collection or expense to start the page.</div></div>'; return; }

  const order = [...days.keys()].sort().reverse();
  el.innerHTML = order.map(d => {
    const items = days.get(d).sort((a, b) => (a.t < b.t ? -1 : a.t > b.t ? 1 : 0));
    const lk = locks.get(d);
    const closed = lk && lk.locked_at;
    const startBal = balanceAt(addDays(d, -1));
    const rows = items.map(it => {
      if (it.type === 'c') {
        const c = it.c, diff = Number(c.difference);
        const who = c.kind === 'handover' ? `Handover ${esc(c.handed_from)} → ${esc(c.handed_to)}` : c.kind === 'closing' ? `Closing count · ${esc(c.counted_by)}` : `Count · ${esc(c.counted_by)}`;
        return `<button type="button" class="box ${c.kind === 'closing' ? 'closing' : ''} ${c.voided_at ? 'void' : ''}" data-c="${c.id}">
          <span class="d">${who}<small>${tLabel(c.counted_at)} · book ${peso(c.book_balance)} · <span class="${diff === 0 ? 'diff0' : 'diffx'}">${diff === 0 ? 'balanced' : (diff < 0 ? 'short ' : 'over ') + peso(Math.abs(diff))}</span></small></span>
          <span class="a">${peso(c.counted_total)}</span></button>`;
      }
      const e = it.e, [title, sub] = lineText(e), s = Number(e.signed_amount);
      return `<button type="button" class="ln ${it.type === 'v' ? 'void' : ''}" data-e="${e.id}">
        <span class="d">${title}<small>${tLabel(e.entered_at)}${sub ? ' · ' + sub : ''}${it.type === 'v' ? ' · voided: ' + esc(e.void_reason) : ''}</small></span>
        <span class="a ${s >= 0 ? 'in' : 'out'}">${pesoS(s)}</span>
        <span class="b">${it.type === 'v' ? '' : peso(e.running_balance)}</span></button>`;
    }).join('');
    const endBal = balanceAt(d);
    return `<article class="page">
      <div class="page-hd"><h3>${dLabel(d)}</h3>${closed
        ? `<span class="stamp closed">Closed · ${esc(lk.locked_by)}</span>`
        : `<span class="stamp open">Open</span>`}</div>
      <div class="carry"><span>Carried from before</span><b>${peso(startBal)}</b></div>
      ${rows}
      <div class="carry"><span>${closed ? 'Closing balance' : 'Balance so far'}</span><b>${peso(endBal)}</b></div>
    </article>`;
  }).join('');
}
$('book').addEventListener('click', e => {
  const l = e.target.closest('[data-e]'), c = e.target.closest('[data-c]');
  if (l) openDetail('e', +l.dataset.e); else if (c) openDetail('c', +c.dataset.c);

/* ---------- sheet ---------- */
function openSheet(kind, preset){
  S.form = { kind, cid:uuid(), mode:null, ...(preset || {}) };
  $('sh-body').innerHTML = ''; renderSheet();
  $('scrim').classList.add('on'); $('sheet').classList.add('on');
  setTimeout(() => { const f = $('sh-body').querySelector('input.money,input,select'); if (f && kind !== 'detail') f.focus({preventScroll:true}); }, 260);
}
function closeSheet(){ $('scrim').classList.remove('on'); $('sheet').classList.remove('on'); S.form = null; }
$('scrim').addEventListener('click', closeSheet); $('sh-x').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.form) closeSheet(); });

const v = id => { const x = $(id); return x ? x.value.trim() : ''; };
const seg = (opts, cur) => `<div class="seg">${opts.map(([k, l]) => `<button type="button" data-mode="${k}" class="${k === cur ? 'on' : ''}">${l}</button>`).join('')}</div>`;
const money = (id, label, val = '') => `<div class="f"><label for="${id}">${label}</label><input id="${id}" class="money" inputmode="decimal" autocomplete="off" placeholder="0" value="${esc(val)}"></div>`;
const text = (id, label, val = '', extra = '') => `<div class="f"><label for="${id}">${label}</label><input id="${id}" autocomplete="off" value="${esc(val)}" ${extra}></div>`;
const dlist = (id, arr) => `<datalist id="${id}">${(arr || []).map(x => `<option value="${esc(x)}">`).join('')}</datalist>`;
const actions = (label, cls = '') => `<button class="go ${cls}" type="button" id="sh-save">${label}</button><div class="msg" id="sh-msg" role="alert"></div>`;

function renderSheet(){
  const F = S.form, L = S.look || {}, body = $('sh-body');
  let title = '', h = '';
  if (F.kind === 'collect') {
    F.mode = F.mode || 'collection';
    title = 'Record collection';
    h += seg([['collection','Collector'],['office_collection','Office'],['gcash_cashout','GCash'],['other_in','Other']], F.mode);
    if (F.mode === 'collection') {
      const rc = (L.recons || []);
      if (rc.length) h += `<div class="f"><label>From Spawn Count (confirmed, not yet in the book)</label>${rc.map(r =>
        `<button type="button" class="recon ${F.recon && F.recon.id === r.id ? 'on' : ''}" data-recon="${r.id}">${esc(r.collector)} · ${dLabel(r.date)} · remit ${peso(r.net_to_remit)} <span style="font-weight:500">(${r.vendos} vendos, by ${esc(r.confirmed_by)})</span></button>`).join('')}</div>`;
      h += `<div class="f"><label>Collector</label><div class="chips" id="col-chips">${(L.collectors || []).map(c =>
        `<button type="button" data-col="${esc(c.name)}" class="${F.collector === c.name ? 'on' : ''}">${esc(c.name)}</button>`).join('')}</div></div>`;
      h += money('f-ht', 'Harvest total (Spawn share)', F.ht ?? '');
      h += `<div class="two">${money('f-le', 'Less expense', F.le ?? '')}${money('f-lb', 'Less bugi', F.lb ?? '')}</div>`;
      h += money('f-amt', 'Cash counted from collector', F.amt ?? '');
      h += `<div class="calc" id="calc"></div>`;
    } else {
      h += money('f-amt', 'Amount', F.amt ?? '');
      if (F.mode === 'office_collection') h += text('f-party', 'From (optional)', F.party || '', 'placeholder="Subscriber or payer"');
      h += text('f-memo', 'Note', F.memo || '', F.mode === 'other_in' ? 'placeholder="What is this cash?"' : '');
    }
    h += actions('Save collection');
  }
  else if (F.kind === 'expense') {
    F.mode = F.mode || 'expense';
    title = 'Record expense';
    h += seg([['expense','Expense'],['other_out','Other cash out']], F.mode);
    h += money('f-amt', 'Amount', F.amt ?? '');
    if (F.mode === 'expense') {
      const cats = L.categories || [];
      h += `<div class="f"><label>Category</label><div class="chips" id="cat-chips">${cats.slice(0, 9).map(c =>
        `<button type="button" data-cat="${esc(c)}" class="${F.cat === c ? 'on' : ''}">${esc(c)}</button>`).join('')}</div>
        ${cats.length > 9 ? `<select id="f-cat-more" style="margin-top:8px"><option value="">More categories…</option>${cats.slice(9).map(c => `<option ${F.cat === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>` : ''}</div>`;
    }
    h += text('f-memo', 'Description', F.memo || '', 'placeholder="e.g. Gas – Mark, wrapper, fiber 200m"');
    h += `<div class="two">${text('f-party', 'Paid to (optional)', F.party || '', 'list="dl-parties"')}<div class="f"><label for="f-area">Area (optional)</label><select id="f-area"><option value=""></option>${AREAS.map(a => `<option ${F.area === a ? 'selected' : ''}>${a}</option>`).join('')}</select></div></div>`;
    h += dlist('dl-parties', L.parties);
    h += actions('Save expense');
  }
  else if (F.kind === 'advance') {
    F.mode = F.mode || 'advance';
    title = 'Cash advance / c/o';
    h += seg([['advance','Cash advance'],['co','c/o'],['repay','Repayment']], F.mode);
    h += text('f-party', 'Person', F.party || '', 'list="dl-parties" placeholder="Name"') + dlist('dl-parties', L.parties);
    h += `<div class="calc hide" id="owed-now"></div>`;
    h += money('f-amt', 'Amount', F.amt ?? '');
    h += text('f-memo', 'Note (optional)', F.memo || '');
    h += actions(F.mode === 'repay' ? 'Save repayment' : F.mode === 'co' ? 'Save c/o' : 'Save cash advance');
  }
  else if (F.kind === 'count') {
    F.mode = F.mode || 'count';
    title = F.result ? 'Count saved' : 'Count / Handover';
    if (F.result) { h = countResult(F.result); }
    else {
      h += seg([['count','Count'],['handover','Handover']], F.mode);
      if (F.mode === 'handover') {
        h += `<div class="f"><label>Hand cash to</label><div class="chips" id="to-chips">${(L.accounts || []).filter(a => a !== S.user.name).map(a =>
          `<button type="button" data-to="${esc(a)}" class="${F.to === a ? 'on' : ''}">${esc(a)}</button>`).join('')}</div></div>`;
      }
      h += denomFields(F);
      h += `<div class="calc" id="calc"></div>`;
      h += text('f-memo', 'Note (optional)', F.memo || '');
      h += actions(F.mode === 'handover' ? 'Save handover' : 'Save count');
    }
  }
  else if (F.kind === 'deposit') {
    title = 'Bank deposit';
    const banks = [...new Set([...(L.banks || []), ...BANK_DEFAULTS])];
    h += text('f-bank', 'Bank', F.bank || (L.banks || [])[0] || '', 'list="dl-banks"') + dlist('dl-banks', banks);
    h += money('f-amt', 'Amount deposited', F.amt ?? '');
    h += text('f-ref', 'Reference no. on the slip', F.ref || '');
    h += `<div class="two"><div class="f"><label for="f-cf">Covers from</label><input id="f-cf" type="date" value="${esc(F.cf || '')}"></div><div class="f"><label for="f-ct">Covers to</label><input id="f-ct" type="date" value="${esc(F.ct || '')}"></div></div>`;
    h += text('f-by', 'Deposited by', F.by || S.user.name, 'list="dl-parties"') + dlist('dl-parties', L.parties);
    h += actions('Save deposit');
  }
  else if (F.kind === 'close') {
    const d = F.date || openDays()[0] || todayPH();
    F.date = d;
    title = 'Close ' + (d === todayPH() ? 'today' : dLabel(d));
    if (F.result) { h = closeResult(F.result); }
    else {
      h += `<div class="note">Count all the cash, then sign with your PIN. After closing, nobody can change ${d === todayPH() ? 'today' : dLabel(d)}. Fix mistakes with an adjustment on the next open day.</div>`;
      h += denomFields(F);
      h += `<div class="calc" id="calc"></div>`;
      h += text('f-memo', 'Note (optional)', F.memo || '');
      h += `<div class="f"><label for="f-sign">Sign with your PIN</label><input id="f-sign" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••"></div>`;
      h += actions('Close and lock the day');
    }
  }
  else if (F.kind === 'owner') {
    title = 'Owner settings';
    const cut = S.user.cutover;
    const hasOpening = S.book.entries.some(e => e.kind === 'opening');
    h += `<div class="sec" style="margin-top:0">Opening balance</div>`;
    if (hasOpening) h += `<div class="calc"><div><span>Already set</span><b>${peso(S.book.entries.find(e => e.kind === 'opening').amount)}</b></div></div>`;
    else h += `<div class="note">Count the office cash once, then enter it here. The running balance starts from this amount.</div>${money('f-open', 'Cash counted now')}<button class="go" type="button" id="own-open">Set opening balance</button>`;
    h += `<div class="sec">Posting to the books</div>`;
    h += `<div class="note">${cut
      ? `On since <b>${dLabel(cut)}</b>. Closed days from that date post to the ledger from this book; the daily expense book and cash receipts sheet no longer count for those days.`
      : `Off. The ledger still uses the daily expense book and the cash receipts sheet. Turn this on only after the app and the notebook match for one to two weeks.`}</div>`;
    h += `<div class="f"><label for="f-cut">Post from this date</label><input id="f-cut" type="date" value="${esc(cut || todayPH())}"></div>`;
    h += `<button class="go" type="button" id="own-cut">${cut ? 'Change posting date' : 'Turn on posting'}</button>`;
    if (cut) h += `<button class="go alt" type="button" id="own-off">Turn off posting</button>`;
    h += `<div class="msg" id="sh-msg" role="alert"></div>`;
  }
  else if (F.kind === 'detail') {
    title = F.title; h = F.html;
  }
  $('sh-title').textContent = title;
  body.innerHTML = h;
  wireSheet();
}

function denomFields(F){
  return `<div class="two">${money('f-p5', '₱5 packs', F.p5 ?? '')}${money('f-p1', '₱1 packs', F.p1 ?? '')}</div>
          <div class="two">${money('f-bills', 'Bills', F.bills ?? '')}${money('f-loose', 'Loose coins', F.loose ?? '')}</div>`;
}
function denomTotal(){ return num(v('f-p5')) + num(v('f-p1')) + num(v('f-bills')) + num(v('f-loose')); }

function liveCalc(){
  const F = S.form; if (!F) return; const c = $('calc');
  if (F.kind === 'collect' && F.mode === 'collection' && c) {
    const ht = num(v('f-ht')), le = num(v('f-le')), lb = num(v('f-lb')), amt = num(v('f-amt'));
    if (!v('f-ht')) { c.innerHTML = `<div><span>Book gets</span><b>${peso(amt)}</b></div>`; return; }
    const should = ht - le - lb, so = amt - should;
    c.innerHTML = `<div><span>Should hand in</span><b>${peso(should)}</b></div><div><span>Counted</span><b>${peso(amt)}</b></div>
      <div class="big"><span>${so < 0 ? 'Short' : so > 0 ? 'Over' : 'Balanced'}</span><b class="${so === 0 ? 'diff0' : 'diffx'}">${so === 0 ? '✓' : peso(Math.abs(so))}</b></div>`;
  }
  if ((F.kind === 'count' || F.kind === 'close') && c) {
    const tot = denomTotal(), book = F.kind === 'close' ? balanceAt(F.date) : Number(S.book.balance_now), diff = tot - book;
    c.innerHTML = `<div><span>Counted</span><b>${peso(tot)}</b></div><div><span>Book says</span><b>${peso(book)}</b></div>
      <div class="big"><span>${diff < 0 ? 'Short' : diff > 0 ? 'Over' : 'Balanced'}</span><b class="${diff === 0 ? 'diff0' : 'diffx'}">${diff === 0 ? '✓' : peso(Math.abs(diff))}</b></div>`;
  }
  if (F.kind === 'advance') {
    const o = $('owed-now'), p = v('f-party').toLowerCase();
    const row = p && S.book.owed.find(x => x.party.toLowerCase() === p);
    o.classList.toggle('hide', !row);
    if (row) o.innerHTML = `<div><span>${esc(row.party)} owes now</span><b>${peso(row.outstanding)}</b></div>`;
  }
}

function keep(){ // remember typed values when switching modes
  const F = S.form; if (!F) return;
  const map = { 'f-amt':'amt','f-ht':'ht','f-le':'le','f-lb':'lb','f-memo':'memo','f-party':'party','f-bank':'bank','f-ref':'ref','f-cf':'cf','f-ct':'ct','f-by':'by','f-p5':'p5','f-p1':'p1','f-bills':'bills','f-loose':'loose','f-area':'area' };
  for (const [id, k] of Object.entries(map)) if ($(id)) F[k] = $(id).value;
}

function wireSheet(){
  const F = S.form, body = $('sh-body');
  body.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { keep(); F.mode = b.dataset.mode; F.cid = uuid(); renderSheet(); });
  body.querySelectorAll('[data-col]').forEach(b => b.onclick = () => { keep(); F.collector = b.dataset.col; if (F.recon && F.recon.collector !== F.collector) F.recon = null; renderSheet(); });
  body.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => { keep(); F.cat = b.dataset.cat; renderSheet(); });
  body.querySelectorAll('[data-to]').forEach(b => b.onclick = () => { keep(); F.to = b.dataset.to; renderSheet(); });
  body.querySelectorAll('[data-recon]').forEach(b => b.onclick = () => {
    keep(); const r = S.look.recons.find(x => x.id === +b.dataset.recon);
    if (F.recon && F.recon.id === r.id) { F.recon = null; }
    else { F.recon = r; F.collector = r.collector; F.ht = r.spawn_share; F.le = r.expenses || ''; F.lb = ''; F.amt = ''; }
    renderSheet();
  });
  const more = $('f-cat-more'); if (more) more.onchange = () => { keep(); F.cat = more.value || null; renderSheet(); };
  body.querySelectorAll('input').forEach(i => i.addEventListener('input', liveCalc));
  liveCalc();
  const save = $('sh-save'); if (save) save.onclick = () => submit(save);
  if ($('own-open')) $('own-open').onclick = ownerOpening;
  if ($('own-cut')) $('own-cut').onclick = () => ownerCutover(v('f-cut') || null);
  if ($('own-off')) $('own-off').onclick = () => ownerCutover(null);
  if ($('rs-adjust')) $('rs-adjust').onclick = adjustFromCount;
  if ($('rs-done')) $('rs-done').onclick = closeSheet;
  if ($('dt-void')) $('dt-void').onclick = doVoid;
}

function busy(btn, on, label){ btn.disabled = on; if (on) { btn.dataset.l = btn.textContent; btn.innerHTML = '<span class="spin"></span> Saving'; } else btn.textContent = label || btn.dataset.l; }
function say(m, ok){ const x = $('sh-msg'); if (x) { x.textContent = m; x.className = 'msg ' + (ok ? 'ok' : 'bad'); } }

async function submit(btn){
  const F = S.form; keep(); say('');
  try {
    busy(btn, true);
    let r;
    if (F.kind === 'collect') {
      const det = {};
      if (F.mode === 'collection') {
        if (!F.collector) throw new Error(ERR.collector_required);
        Object.assign(det, { collector:F.collector, area:(S.look.collectors.find(c => c.name === F.collector) || {}).area || null });
        if (v('f-ht')) Object.assign(det, { harvest_total:num(v('f-ht')), less_expense:num(v('f-le')), less_bugi:num(v('f-lb')) });
        if (F.recon) det.recon_id = F.recon.id;
      } else {
        if (v('f-party')) det.party = v('f-party');
        if (v('f-memo')) det.memo = v('f-memo');
      }
      r = await rpc('fin_cash_add', { p_pin:S.pin, p_client_id:F.cid, p_kind:F.mode, p_amount:num(v('f-amt')), p_detail:det });
      const so = Number(r.short_over || 0);
      toast(so ? `Saved. ${so < 0 ? 'Short' : 'Over'} ${peso(Math.abs(so))}.` : 'Collection saved.');
    }
    else if (F.kind === 'expense') {
      if (F.mode === 'expense' && !F.cat) throw new Error(ERR.category_required);
      const det = { memo:v('f-memo') || null, party:v('f-party') || null, area:v('f-area') || null };
      if (F.mode === 'expense') det.category = F.cat;
      r = await rpc('fin_cash_add', { p_pin:S.pin, p_client_id:F.cid, p_kind:F.mode, p_amount:num(v('f-amt')), p_detail:det });
      toast('Expense saved.');
    }
    else if (F.kind === 'advance') {
      r = await rpc('fin_cash_add', { p_pin:S.pin, p_client_id:F.cid, p_kind:F.mode, p_amount:num(v('f-amt')), p_detail:{ party:v('f-party'), memo:v('f-memo') || null } });
      toast(F.mode === 'repay' ? 'Repayment saved.' : F.mode === 'co' ? 'c/o saved.' : 'Cash advance saved.');
    }
    else if (F.kind === 'count') {
      if (F.mode === 'handover' && !F.to) throw new Error(ERR.handed_to_unknown);
      r = await rpc('fin_cash_count', { p_pin:S.pin, p_client_id:F.cid, p_kind:F.mode, p_packs_5:num(v('f-p5')), p_packs_1:num(v('f-p1')),
        p_bills:num(v('f-bills')), p_loose:num(v('f-loose')), p_handed_to:F.mode === 'handover' ? F.to : null, p_memo:v('f-memo') || null });
      F.result = r; await refresh(); renderSheet(); return;
    }
    else if (F.kind === 'deposit') {
      r = await rpc('fin_deposit_add', { p_pin:S.pin, p_client_id:F.cid, p_amount:num(v('f-amt')), p_bank:v('f-bank'), p_reference_no:v('f-ref') || null,
        p_covers_from:v('f-cf') || null, p_covers_to:v('f-ct') || null, p_deposited_by:v('f-by') || null });
      toast('Deposit saved.');
    }
    else if (F.kind === 'close') {
      const sign = v('f-sign');
      if (!/^\d{4}$/.test(sign)) throw new Error('Enter your 4-digit PIN to sign.');
      r = await rpc('fin_day_lock', { p_pin:sign, p_client_id:F.cid, p_entry_date:F.date, p_packs_5:num(v('f-p5')), p_packs_1:num(v('f-p1')),
        p_bills:num(v('f-bills')), p_loose:num(v('f-loose')), p_memo:v('f-memo') || null });
      F.result = r; await refresh(); renderSheet(); return;
    }
    closeSheet(); await refresh();
  } catch (e) {
    say(e.message); busy(btn, false);
  }
}

function countResult(r){
  const d = Number(r.difference);
  let h = `<div class="calc"><div><span>Counted</span><b>${peso(r.counted_total)}</b></div><div><span>Book said</span><b>${peso(r.book_balance)}</b></div>
    <div class="big"><span>${d < 0 ? 'Short' : d > 0 ? 'Over' : 'Balanced'}</span><b class="${d === 0 ? 'diff0' : 'diffx'}">${d === 0 ? '✓' : peso(Math.abs(d))}</b></div></div>`;
  if (d !== 0) h += `<div class="note">The book still says ${peso(r.book_balance)}. If the count is right and the difference can't be found, add an adjustment so the book matches the cash.</div>
    <button class="go" type="button" id="rs-adjust">Add ${peso(Math.abs(d))} adjustment ${d < 0 ? 'out' : 'in'}</button>`;
  h += `<button class="go ${d !== 0 ? 'alt' : ''}" type="button" id="rs-done">Done</button><div class="msg" id="sh-msg"></div>`;
  return h;
}
function closeResult(r){
  const d = Number(r.difference);
  return `<div class="note" style="background:var(--teal-l)">${dLabel(r.entry_date)} is closed${r.posted ? ' and posted to the books' : ''}.</div>
    <div class="calc"><div><span>Closing balance</span><b>${peso(r.closing_balance)}</b></div><div><span>Counted</span><b>${peso(r.counted_total)}</b></div>
    <div class="big"><span>${d < 0 ? 'Short' : d > 0 ? 'Over' : 'Balanced'}</span><b class="${d === 0 ? 'diff0' : 'diffx'}">${d === 0 ? '✓' : peso(Math.abs(d))}</b></div></div>
    ${d !== 0 ? `<div class="note">To carry the counted cash forward instead, add a ${peso(Math.abs(d))} adjustment on the next day.</div>` : ''}
    <button class="go" type="button" id="rs-done">Done</button>`;
}
async function adjustFromCount(){
  const F = S.form, d = Number(F.result.difference), btn = $('rs-adjust');
  if (!F.adjCid) F.adjCid = uuid();
  try {
    busy(btn, true);
    await rpc('fin_cash_add', { p_pin:S.pin, p_client_id:F.adjCid, p_kind:d < 0 ? 'adjust_out' : 'adjust_in', p_amount:Math.abs(d),
      p_detail:{ memo:`Count difference: counted ${peso(F.result.counted_total)}, book ${peso(F.result.book_balance)}` } });
    toast('Adjustment saved. The book now matches the count.'); closeSheet(); await refresh();
  } catch (e) { say(e.message); busy(btn, false); }
}

/* ---------- detail + void ---------- */
function openDetail(type, id){
  const B = S.book;
  const e = type === 'e' ? (B.entries.find(x => x.id === id) || B.voided.find(x => x.id === id)) : null;
  const c = type === 'c' ? B.counts.find(x => x.id === id) : null;
  const rec = e || c; if (!rec) return;
  const date = rec.entry_date;
  const locked = B.days.some(d => d.entry_date === date && d.locked_at);
  const rows = [];
  let title;
  if (e) {
    const [t, sub] = lineText(e); title = t.replace(/<[^>]+>/g, '');
    rows.push(['Amount', pesoS(Number(e.signed_amount))]);
    if (sub) rows.push(['Details', sub]);
    if (e.category) rows.push(['Category', esc(e.category)]);
    if (e.area) rows.push(['Area', esc(e.area)]);
    rows.push(['Date', dLabel(e.entry_date) + ' · ' + tLabel(e.entered_at)], ['Entered by', esc(e.created_by)], ['Cash held by', esc(e.custodian || '')]);
    if (e.voided_at) rows.push(['Voided', `${esc(e.voided_by)}: ${esc(e.void_reason)}`]);
  } else {
    title = c.kind === 'handover' ? 'Handover' : c.kind === 'closing' ? 'Closing count' : 'Count';
    rows.push(['Counted', peso(c.counted_total)], ['₱5 packs', peso(c.packs_5)], ['₱1 packs', peso(c.packs_1)], ['Bills', peso(c.bills)], ['Loose coins', peso(c.loose)],
      ['Book said', peso(c.book_balance)], ['Difference', pesoS(Number(c.difference))], ['By', esc(c.counted_by)]);
    if (c.kind === 'handover') rows.push(['Handed', `${esc(c.handed_from)} → ${esc(c.handed_to)}`]);
    if (c.memo) rows.push(['Note', esc(c.memo)]);
    if (c.voided_at) rows.push(['Voided', `${esc(c.voided_by)}: ${esc(c.void_reason)}`]);
  }
  let html = `<dl class="kv">${rows.map(([k, val]) => `<dt>${k}</dt><dd>${val}</dd>`).join('')}</dl>`;
  const canVoid = !rec.voided_at && !locked && !(c && c.kind === 'closing') && !(e && e.kind === 'opening' && !S.user.is_owner);
  if (canVoid) html += `<div class="f"><label for="f-reason">Reason for voiding</label><input id="f-reason" autocomplete="off" placeholder="e.g. Double entry, wrong amount"></div>
    <button class="go danger" type="button" id="dt-void">Void this line</button><div class="msg" id="sh-msg" role="alert"></div>`;
  else if (locked) html += `<div class="note">This day is closed, so this line can't be changed. Fix it with an adjustment on today.</div>`;
  openSheet('detail', { title, html, ref:{ type, id, rec } });
}
async function doVoid(){
  const F = S.form, btn = $('dt-void'), { type, id, rec } = F.ref;
  try {
    busy(btn, true);
    let what = type === 'c' ? 'count' : 'entry', target = id;
    if (type === 'e' && rec.kind === 'deposit') { what = 'deposit'; target = rec.deposit_id; }
    await rpc('fin_cash_void', { p_pin:S.pin, p_what:what, p_id:target, p_reason:v('f-reason') });
    toast('Line voided.'); closeSheet(); await refresh();
  } catch (e) { say(e.message); busy(btn, false); }
}

/* ---------- owner ---------- */
async function ownerOpening(){
  const btn = $('own-open'), F = S.form;
  try {
    busy(btn, true);
    await rpc('fin_cash_add', { p_pin:S.pin, p_client_id:F.cid, p_kind:'opening', p_amount:num(v('f-open')), p_detail:{ memo:'Opening count' } });
    toast('Opening balance set.'); closeSheet(); await refresh();
  } catch (e) { say(e.message); busy(btn, false); }
}
async function ownerCutover(date){
  const btn = date ? $('own-cut') : $('own-off');
  const ask = date ? `Post from ${dLabel(date)}? From that date, closed days in this app replace the daily expense book and cash receipts sheet in the ledger.`
                   : 'Turn off posting? The ledger goes back to the daily expense book and cash receipts sheet.';
  if (!confirm(ask)) return;
  try {
    busy(btn, true);
    const r = await rpc('fin_set_cutover', { p_pin:S.pin, p_date:date });
    S.user.cutover = r.cutover; toast(date ? 'Posting is on.' : 'Posting is off.'); closeSheet(); await refresh();
  } catch (e) { say(e.message); busy(btn, false); }
}

/* ---------- start ---------- */
loadRoster();
</script>
