<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spawn · Subscriber Match Review</title>
<style>
  :root{
    --blue:#025AC6; --gold:#FFB725; --teal:#028867; --magenta:#C01176;
    --red:#DF1A35; --purple:#311A8E;
    --bg:#f4f6fa; --card:#fff; --ink:#14203a; --dim:#7a8aa0; --line:#e3e8f0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       padding-bottom:90px}
  header{position:sticky;top:0;z-index:20;background:var(--blue);color:#fff;
         padding:14px 16px calc(14px + env(safe-area-inset-bottom,0)) 16px;
         box-shadow:0 2px 10px rgba(2,90,198,.25)}
  header h1{margin:0;font-size:17px;font-weight:800;letter-spacing:.2px}
  header .sub{font-size:12px;opacity:.85;margin-top:2px}
  .bar{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;scrollbar-width:none}
  .bar::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;color:var(--dim);
        border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer}
  .chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .wrap{padding:0 12px}
  .row{background:var(--card);border-radius:14px;padding:13px 14px;margin-bottom:10px;
       box-shadow:0 1px 3px rgba(20,32,58,.07);border-left:4px solid var(--line)}
  .row.matched{border-left-color:var(--teal)}
  .row.probable{border-left-color:var(--gold)}
  .row.rejected{border-left-color:var(--red);opacity:.6}
  .row.done{border-left-color:var(--teal);background:#f2fbf7}
  .ppp{font-weight:800;font-size:15px;word-break:break-word}
  .arrow{color:var(--dim);font-size:12px;margin:4px 0 2px}
  .rn{font-weight:600;font-size:14px;word-break:break-word}
  .rn.none{color:var(--red);font-style:italic}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
  .tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;
       background:#eef2f8;color:var(--dim)}
  .tag.area{background:#e8effb;color:var(--blue)}
  .tag.sc{background:#f3edfb;color:var(--purple)}
  .tag.ok{background:#e6f4ee;color:var(--teal)}
  .acts{display:flex;gap:8px;margin-top:11px}
  .btn{flex:1;border:none;border-radius:10px;padding:11px;font-size:13px;font-weight:800;
       cursor:pointer;color:#fff}
  .ok{background:var(--teal)}
  .no{background:var(--red)}
  .undo{background:#eef2f8;color:var(--dim)}
  .empty{text-align:center;color:var(--dim);padding:40px 20px;font-weight:600}
  footer{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);
         padding:11px 16px calc(11px + env(safe-area-inset-bottom,0)) 16px;
         font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:78px;background:var(--ink);
         color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:700;
         opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
  .toast.show{opacity:.95}
  .pick{position:fixed;inset:0;background:rgba(20,32,58,.5);display:none;z-index:50;
        align-items:flex-end}
  .pick.show{display:flex}
  .sheet{background:#fff;width:100%;max-height:80vh;border-radius:16px 16px 0 0;
         display:flex;flex-direction:column}
  .sheet h2{margin:0;padding:15px 16px;font-size:15px;border-bottom:1px solid var(--line)}
  .sheet input{margin:12px 16px;padding:11px 13px;border:1.5px solid var(--line);
               border-radius:10px;font-size:15px}
  .list{overflow:auto;padding:0 8px 16px}
  .item{padding:12px 14px;border-radius:10px;cursor:pointer;font-size:14px}
  .item:active{background:#eef2f8}
  .item small{display:block;color:var(--dim);font-size:11px;font-weight:700}
</style>
</head>
<body>
<header>
  <h1>Subscriber Match Review</h1>
  <div class="sub">Confirm which PPPoE account belongs to which paying subscriber</div>
</header>

<div class="bar" id="bar"></div>
<div class="wrap" id="wrap"><div class="empty">Loading…</div></div>
<footer><span id="tally">—</span><span id="hint" style="color:var(--dim);font-weight:600"></span></footer>
<div class="toast" id="toast"></div>

<div class="pick" id="pick">
  <div class="sheet">
    <h2>Pick the correct subscriber</h2>
    <input id="q" placeholder="Search name…" autocomplete="off">
    <div class="list" id="list"></div>
  </div>
</div>

<script>
const SB="https://cviraqfhphhsonjmrtvu.supabase.co";
const KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN2aXJhcWZocGhoc29uam1ydHZ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2OTY2MTksImV4cCI6MjA5MTI3MjYxOX0.7xtCIZvwIOgYXvaj1fLokiOKXylnxhwbWC4PCwb_D1o";
const H={apikey:KEY,Authorization:"Bearer "+KEY};

let ROWS=[], SUBS=[], FILTER="probable", PICK_FOR=null;

const esc=s=>(s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');
  clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1800);}

async function sb(path){
  const r=await fetch(SB+"/rest/v1/"+path,{headers:H});
  if(!r.ok) throw new Error(path+" → "+r.status);
  return r.json();
}
async function patch(ppp, body){
  const r=await fetch(SB+"/rest/v1/ppp_roster?ppp_name=eq."+encodeURIComponent(ppp),{
    method:"PATCH",
    headers:{...H,"Content-Type":"application/json","Prefer":"return=minimal"},
    body:JSON.stringify(body)
  });
  if(!r.ok) throw new Error("HTTP "+r.status);
}

// A PPPoE account with no ppp_roster row is not on the roster at all.
async function load(){
  const [roster, accounts, subs] = await Promise.all([
    sb("ppp_roster?select=*&limit=2000"),
    sb("mikrotik_status?kind=eq.ppp&server_name=eq.Dicayas%20Server&select=ppp_name,online&limit=2000"),
    sb("subscribers?select=name,area&order=name&limit=2000")
  ]);
  SUBS=subs||[];
  const byName=new Map((roster||[]).map(r=>[r.ppp_name,r]));
  ROWS=(accounts||[]).map(a=>{
    const r=byName.get(a.ppp_name);
    return {ppp:a.ppp_name, online:a.online,
            roster:r?r.roster_name:null, status:r?r.match_status:'none',
            area:r?r.area:null, score:r?r.score:null, confirmed:r?r.confirmed_at:null};
  }).sort((a,b)=>a.ppp.localeCompare(b.ppp));
  render();
}

const FILTERS=[
  ["probable","Needs review"],
  ["matched","Auto-matched"],
  ["none","Not on roster"],
  ["confirmed","Confirmed"],
  ["all","All"]
];
function bucket(r){
  if(r.confirmed) return "confirmed";
  return r.status==='none' ? 'none' : r.status;
}
function render(){
  document.getElementById('bar').innerHTML=FILTERS.map(([k,l])=>{
    const n=ROWS.filter(r=>k==='all'||bucket(r)===k).length;
    return `<button class="chip ${FILTER===k?'on':''}" data-f="${k}">${l} ${n}</button>`;
  }).join('');

  const list=ROWS.filter(r=>FILTER==='all'||bucket(r)===FILTER);
  document.getElementById('wrap').innerHTML = list.length ? list.map(cardHtml).join('')
    : '<div class="empty">Nothing here 🎉</div>';

  const conf=ROWS.filter(r=>r.confirmed).length;
  const rej=ROWS.filter(r=>r.status==='rejected').length;
  document.getElementById('tally').textContent=`${conf} confirmed · ${rej} rejected · ${ROWS.length} accounts`;
  document.getElementById('hint').textContent=FILTER==='probable'?'Check these first':'';
}
function cardHtml(r){
  const cls=r.confirmed?'done':(r.status==='rejected'?'rejected':r.status);
  const name = r.roster ? `<div class="rn">${esc(r.roster)}</div>`
                        : `<div class="rn none">not on the subscriber roster</div>`;
  return `<div class="row ${cls}">
    <div class="ppp">${esc(r.ppp)}</div>
    <div class="arrow">▾ believed to be</div>
    ${name}
    <div class="tags">
      ${r.area?`<span class="tag area">${esc(r.area)}</span>`:''}
      ${r.score!=null?`<span class="tag sc">score ${Number(r.score).toFixed(2)}</span>`:''}
      <span class="tag">${r.online?'online':'offline'}</span>
      ${r.confirmed?'<span class="tag ok">✔ confirmed</span>':''}
    </div>
    <div class="acts">
      ${r.confirmed
        ? `<button class="btn undo" data-a="undo" data-p="${esc(r.ppp)}">Undo</button>`
        : `<button class="btn ok" data-a="ok" data-p="${esc(r.ppp)}">✔ Correct</button>
           <button class="btn no" data-a="no" data-p="${esc(r.ppp)}">✖ Wrong match</button>`}
    </div>
  </div>`;
}

document.getElementById('bar').addEventListener('click',e=>{
  const b=e.target.closest('.chip'); if(!b) return;
  FILTER=b.dataset.f; render();
});

document.getElementById('wrap').addEventListener('click',async e=>{
  const b=e.target.closest('button[data-a]'); if(!b) return;
  const ppp=b.dataset.p, act=b.dataset.a;
  const row=ROWS.find(r=>r.ppp===ppp); if(!row) return;
  try{
    if(act==='ok'){
      await patch(ppp,{match_status:'matched',confirmed_by:'review-page',
                       confirmed_at:new Date().toISOString(),updated_at:new Date().toISOString()});
      row.status='matched'; row.confirmed=new Date().toISOString();
      toast('Confirmed');
    } else if(act==='undo'){
      await patch(ppp,{confirmed_by:null,confirmed_at:null,updated_at:new Date().toISOString()});
      row.confirmed=null; toast('Reopened');
    } else {
      // Wrong match -> clear it, then offer to pick the right subscriber.
      await patch(ppp,{roster_name:null,area:null,match_status:'rejected',score:null,
                       confirmed_by:null,confirmed_at:null,updated_at:new Date().toISOString()});
      row.roster=null; row.area=null; row.status='rejected'; row.confirmed=null;
      toast('Marked wrong');
      openPick(ppp);
    }
    render();
  }catch(err){ toast('Failed: '+err.message); }
});

function openPick(ppp){
  PICK_FOR=ppp;
  document.getElementById('q').value='';
  drawPick('');
  document.getElementById('pick').classList.add('show');
}
function drawPick(q){
  q=(q||'').toLowerCase();
  const hits=SUBS.filter(s=>!q||s.name.toLowerCase().includes(q)).slice(0,60);
  document.getElementById('list').innerHTML =
    `<div class="item" data-n=""><b>— leave as not on roster —</b></div>` +
    hits.map(s=>`<div class="item" data-n="${esc(s.name)}" data-ar="${esc(s.area)}">
        ${esc(s.name)}<small>${esc(s.area)}</small></div>`).join('');
}
document.getElementById('q').addEventListener('input',e=>drawPick(e.target.value));
document.getElementById('pick').addEventListener('click',async e=>{
  if(e.target.id==='pick'){ document.getElementById('pick').classList.remove('show'); return; }
  const it=e.target.closest('.item'); if(!it) return;
  const name=it.dataset.n||null, area=it.dataset.ar||null;
  const row=ROWS.find(r=>r.ppp===PICK_FOR);
  try{
    if(name){
      await patch(PICK_FOR,{roster_name:name,area,match_status:'matched',score:1,
                            confirmed_by:'review-page',confirmed_at:new Date().toISOString(),
                            updated_at:new Date().toISOString()});
      if(row){row.roster=name;row.area=area;row.status='matched';row.confirmed=new Date().toISOString();}
      toast('Linked to '+name);
    }
    document.getElementById('pick').classList.remove('show');
    render();
  }catch(err){ toast('Failed: '+err.message); }
});

load().catch(e=>{
  document.getElementById('wrap').innerHTML='<div class="empty">Load failed: '+esc(e.message)+'</div>';
});
</script>
</body>
</html>
