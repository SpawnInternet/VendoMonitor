<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spawn Keys — reinstall needed</title>
<style>
 body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#025AC6;color:#fff;
      min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
 .card{max-width:340px;text-align:center}
 h1{font-size:20px;margin:10px 0 6px}
 ol{text-align:left;font-size:14px;line-height:1.8;padding-left:22px;opacity:.95}
 a.btn{display:inline-block;background:#FFB725;color:#0b2c5e;font-weight:800;text-decoration:none;
       padding:14px 22px;border-radius:12px;font-size:15px;margin-top:16px}
</style>
</head>
<body>
 <div class="card">
  <div style="font-size:44px">&#128273;</div>
  <h1>This icon is out of date</h1>
  <p style="font-size:13px;opacity:.9;line-height:1.5">Spawn Keys moved. This shortcut cannot update itself &mdash;
  it has to be replaced once.</p>
  <ol>
   <li>Delete this icon from your home screen</li>
   <li>Tap the button below</li>
   <li>Menu (&#8942;) &rarr; <b>Install app</b></li>
  </ol>
  <a class="btn" href="/VendoMonitor/keys/spawn-keys.html">Open new Spawn Keys &rarr;</a>
 </div>
<script>
// No auto-redirect. The old install has a different manifest id and Chrome
// will never migrate it, so forwarding silently just produces an app that
// half-works with the wrong identity. Show the keeper what to do instead.
// Still clear out the retired root-scope worker and its stale caches.
(async function(){
  try{
    if('serviceWorker' in navigator){
      for(const r of await navigator.serviceWorker.getRegistrations()){
        const sw = r.active || r.waiting || r.installing;
        if(sw && sw.scriptURL && sw.scriptURL.indexOf('sw-keys.js') !== -1 &&
           r.scope.indexOf('/VendoMonitor/keys/') === -1){
          try{ await r.unregister(); }catch(_){}
        }
      }
    }
    if('caches' in window){
      const ks = await caches.keys();
      await Promise.all(ks.filter(k => k.indexOf('spawn-keys') !== -1 && k.indexOf('keysfolder') === -1)
                          .map(k => caches.delete(k).catch(()=>{})));
    }
  }catch(_){}
})();
</script>
</body>
</html>
