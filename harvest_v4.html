<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harvest V4 moved</title>
<style>
 body{margin:0;font-family:system-ui,sans-serif;background:#FFB725;color:#0b2c5e;min-height:100vh;
      display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
 a.btn{display:inline-block;margin-top:16px;background:#025AC6;color:#fff;text-decoration:none;
       font-weight:800;padding:13px 24px;border-radius:12px}
</style>
</head>
<body>
 <div>
  <div style="font-size:40px">&#128273;</div>
  <h2 style="margin:8px 0">Harvest V4 has moved</h2>
  <p style="font-size:13px;opacity:.85">Cleaning up the old install&hellip;</p>
  <a class="btn" href="/VendoMonitor/v4/harvest_v4.html">Open V4 &rarr;</a>
 </div>
<script>
// v4 moved to /VendoMonitor/v4/ so it gets a real DIRECTORY manifest scope.
// The old scope was '/VendoMonitor/harvest_v4' — a bare prefix, not a
// directory. That works in a browser tab but not in an installed WebAPK,
// where the window failed its own scope check at launch and closed itself.
// Remove every v4 worker that is not in the new folder before redirecting.
(async function(){
  try{
    if('serviceWorker' in navigator){
      const regs = await navigator.serviceWorker.getRegistrations();
      for(const r of regs){
        const sw = r.active || r.waiting || r.installing;
        if(sw && sw.scriptURL && sw.scriptURL.indexOf('sw-v4.js') !== -1 &&
           r.scope.indexOf('/VendoMonitor/v4/') === -1){
          try{ await r.unregister(); }catch(_){}
        }
      }
    }
    if('caches' in window){
      const ks = await caches.keys();
      // v4's own stale caches only. Never harvest v3, office, mobile or keys.
      await Promise.all(ks.filter(k => k.indexOf('spawn-harvest-v4') !== -1 &&
                                       k.indexOf('folder') === -1)
                          .map(k => caches.delete(k).catch(()=>{})));
    }
  }catch(_){}
  setTimeout(function(){ location.replace('/VendoMonitor/v4/harvest_v4.html'); }, 900);
})();
</script>
</body>
</html>
